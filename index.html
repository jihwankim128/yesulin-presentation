function sayMarkup() {
  return `<div class="say talking"><span class="say-name">${escapeHtml(CONFIG.narrator)}</span><img class="say-portrait" src="${heroPortraitUrl}" alt=""><p class="say-text"></p></div>`;
}

function renderSlide(direction) {
  const wasWalking = !!frameEl.querySelector('.scene-actor.is-walking');
  cancelSceneMotion();
  const { index, slides } = deck;
  const slide = slides[index];
  if (slide.scene === 'request') deck.requestStep = direction === 'prev' ? slide.turns.length - 1 : 0;
  const { kind, body } = slideMarkup(slide);
  const say = slide.say ? sayMarkup() : '';
  if (kind === 'crossroads' && frameEl.querySelector('.crossroad-scene')) {
    continueCrossroadScene(slide, wasWalking);
  } else {
    frameEl.innerHTML = `<article class="slide slide--${kind}${say ? ' has-say' : ''} from-${direction}">${body}${say}</article>`;
  }

  if (slide.scene === 'goals') {
    deck.castStep = direction === 'prev' ? slide.turns.length - 1 : 0;
    renderGoalState(direction === 'next' ? 0 : null);
  }
  if (slide.scene === 'request') renderRequestState();
  arena = null;
  stamina = null;
  if (slide.stages) {
    deck.stage = direction === 'prev' ? slide.stages.length - 1 : 0;
    if (slide.type === 'arena') setupArena(slide);
    if (slide.type === 'stamina') setupStamina();
    renderStage(false);
  }

  frameEl.querySelectorAll('.slide-media img, .stack-card img').forEach(img => img.addEventListener('error', () => {
    const missing = document.createElement('div');
    missing.className = 'media-missing';
    missing.innerHTML = `<span>이미지를 넣어주세요</span><code>${escapeHtml(img.getAttribute('src'))}</code>`;
    img.replaceWith(missing);
  }, { once: true }));
  frameEl.querySelectorAll('[data-stack]').forEach(setupStack);
  if (slide.type === 'dialogue') {
    deck.dialogueStep = direction === 'prev' ? slide.turns.length : 0;
    renderDialogueState();
  }

  const sayText = frameEl.querySelector('.say-text');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  deck.typing = sayText ? { el: sayText, text: slide.type === 'sequence' ? slide.stages[deck.stage].say ?? slide.say : slide.say, start: time } : null;
  if (deck.typing && reduce) finishTyping();

  const act = currentAct();
  const labels = act ? actLabels(act) : null;
  document.getElementById('deck-act').textContent = slide.type === 'toc' ? '목차' : labels ? `${labels.num} ${labels.role}` : '';
  document.getElementById('deck-count').textContent = index === slides.length - 1
    ? `${index + 1} / ${slides.length}   다음을 누르면 마을로 돌아가요`
    : `${index + 1} / ${slides.length}`;
  document.getElementById('deck-progress').innerHTML = slides
    .map((s, i) => `<i class="${i <= index ? 'on' : ''}${s.type === 'act' ? ' act-start' : ''}"></i>`).join('');
}

function cancelSceneMotion() {
  sceneAnimations.forEach(animation => animation.cancel());
  sceneAnimations = [];
  frameEl.querySelectorAll('.scene-actor.is-walking').forEach(actor => actor.classList.remove('is-walking'));
}

function animateSceneElement(element, frames, options) {
  const animation = element.animate(frames, options);
  sceneAnimations.push(animation);
  return animation;
}

function renderGoalState(revealIndex = null) {
  const actors = [...frameEl.querySelectorAll('.scene-actor')];
  actors.forEach((actor, index) => {
    const pending = index > deck.castStep;
    actor.classList.toggle('is-pending', pending);
    const bubble = frameEl.querySelector(`.scene-bubble[data-speaker="${actor.dataset.speaker}"]`);
    bubble.classList.toggle('is-pending', pending);
  });
  frameEl.querySelector('.scene-takeaway').classList.toggle('is-pending', deck.castStep < actors.length - 1);
  if (revealIndex !== null) revealCrossroadCast(revealIndex);
}

function revealCrossroadCast(index) {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const reveal = (element, delay, actor = false) => {
    const resting = actor ? 'translate(-50%, -100%)' : 'translateY(0)';
    const entering = reduce ? resting : actor ? 'translate(-50%, calc(-100% + 1.5cqh))' : 'translateY(1.5cqh)';
    animateSceneElement(element, [
      { opacity: 0, visibility: 'hidden', transform: entering, offset: 0 },
      { opacity: 0, visibility: 'visible', transform: entering, offset: .01 },
      { opacity: 1, visibility: 'visible', transform: resting, offset: 1 },
    ], { duration: reduce ? 1 : 480, delay, easing: 'ease-out', fill: 'backwards' });
  };
  const actors = [...frameEl.querySelectorAll('.scene-actor')];
  const actor = actors[index];
  reveal(actor, 0, true);
  reveal(frameEl.querySelector(`.scene-bubble[data-speaker="${actor.dataset.speaker}"]`), 0);
  if (index === actors.length - 1) reveal(frameEl.querySelector('.scene-takeaway'), 480);
}

function renderRequestState(animate = false, movingSpeakers = []) {
  const complete = deck.requestStep === 1;
  const scene = frameEl.querySelector('.crossroad-scene');
  const thought = scene.querySelector('.scene-bubble--learner');
  scene.classList.toggle('is-request-complete', complete);
  thought.classList.toggle('is-pending', !complete);
  if (!animate) return;
  walkSceneActors([...movingSpeakers, '맥O']);
  if (complete && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    animateSceneElement(thought.querySelector('.scene-bubble-copy'), [
      { opacity: 0, transform: 'translateY(-1.2cqh)' }, { opacity: 1, transform: 'translateY(0)' },
    ], { duration: 450, delay: 120, fill: 'backwards' });
  }
}

function walkSceneActors(speakers = null) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  frameEl.querySelectorAll('.scene-actor').forEach((actor, index) => {
    if (speakers && !speakers.includes(actor.dataset.speaker)) return;
    actor.classList.add('is-walking');
    const walk = animateSceneElement(actor.querySelector('.scene-avatar'), [
      { transform: 'translateY(0)' }, { transform: 'translateY(-.25cqh)' }, { transform: 'translateY(0)' },
    ], { duration: index ? 200 : 160, iterations: index ? 8 : 6, delay: index ? 120 : 0 });
    walk.finished.then(() => actor.classList.remove('is-walking'), () => {});
  });
}

function continueCrossroadScene(slide, wasWalking) {
  const scene = frameEl.querySelector('.crossroad-scene');
  const wasWaitingForThought = scene.classList.contains('crossroad-scene--request') && !scene.classList.contains('is-request-complete');
  const waitsForThought = slide.scene === 'request' && deck.requestStep === 0;
  const changesPosition = wasWalking || scene.classList.contains('is-reunited') || scene.classList.contains('crossroad-scene--goals') !== (slide.scene === 'goals');
  frameEl.querySelector('.slide').classList.remove('from-next', 'from-prev');
  frameEl.querySelector('.slide-title').innerHTML = rich(slide.title);
  scene.className = `crossroad-scene crossroad-scene--${slide.scene}`;
  scene.querySelector('.scene-handshake').setAttribute('aria-hidden', 'true');
  scene.querySelector('.scene-path-label').textContent = '같은 프로젝트';
  scene.querySelectorAll('.scene-actor').forEach(actor => {
    actor.removeAttribute('aria-hidden');
    actor.classList.remove('is-pending');
  });
  scene.querySelectorAll('.scene-bubble').forEach(bubble => {
    const index = slide.turns.findIndex(turn => turn.speaker === bubble.dataset.speaker);
    const turn = slide.turns[index];
    bubble.dataset.turn = index;
    bubble.classList.remove('is-pending');
    bubble.classList.toggle('scene-bubble--thought', !!turn.thought);
    bubble.innerHTML = sceneBubbleCopy(turn);
  });
  frameEl.querySelector('.scene-footer').innerHTML = sceneFooterMarkup(slide);
  frameEl.querySelector('.say').classList.replace('done', 'talking');
  frameEl.querySelector('.say-text').textContent = '';
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (changesPosition) walkSceneActors(waitsForThought || (wasWaitingForThought && slide.scene === 'goals') ? ['대O'] : null);
  scene.querySelectorAll('.scene-bubble-copy').forEach((copy, index) => {
    if (waitsForThought && index === 1) return;
    animateSceneElement(copy, [
      { opacity: 0, transform: 'translateY(-1.2cqh)' }, { opacity: 1, transform: 'translateY(0)' },
    ], { duration: 450, delay: changesPosition ? (index ? 550 : 250) : 0, fill: 'backwards' });
  });
  animateSceneElement(frameEl.querySelector('.slide-title'), [{ opacity: .2 }, { opacity: 1 }], { duration: 400 });
}

function renderDialogueState() {
  const slide = deck.slides[deck.index];
  const step = deck.dialogueStep;
  frameEl.querySelectorAll('.scene-bubble').forEach(bubble => bubble.classList.toggle('is-pending', Number(bubble.dataset.turn) > step));
  const complete = step === slide.turns.length;
  const scene = frameEl.querySelector('.crossroad-scene');
  const movesToMeeting = scene.classList.contains('is-reunited') !== complete;
  scene.classList.toggle('is-reunited', complete);
  if (movesToMeeting) { cancelSceneMotion(); walkSceneActors(); }
  frameEl.querySelector('.scene-handshake').setAttribute('aria-hidden', String(!complete));
  frameEl.querySelectorAll('.scene-actor').forEach(actor => actor.setAttribute('aria-hidden', String(complete)));
  frameEl.querySelector('.scene-path-label').textContent = complete ? '다시 함께' : '같은 프로젝트';
  frameEl.querySelector('.dialogue-controls').hidden = complete;
  frameEl.querySelector('.dialogue-takeaway').hidden = !complete;
  frameEl.querySelector('.dialogue-progress').textContent = `${step + 1} / ${slide.turns.length + 1} · ${slide.turns[step]?.speaker ?? '함께 정한 것'}${complete ? '' : '의 이야기'}`;
  frameEl.querySelector('.dialogue-next').textContent = step + 1 < slide.turns.length ? `${slide.turns[step + 1].speaker}의 이야기 보기 ▶` : '다시 함께하기 ▶';
}

function updateTyping() {
  const typing = deck?.typing;
  if (!typing) return;
  const shown = Math.floor((time - typing.start) * 30);
  if (shown >= typing.text.length) return finishTyping();
  typing.el.textContent = typing.text.slice(0, shown);
}

function finishTyping() {
  deck.typing.el.textContent = deck.typing.text;
  deck.typing.el.closest('.say').classList.replace('talking', 'done');
  deck.typing = null;
}

const STACK_TILT = ['0deg', '-4deg', '3deg', '-2deg'];

function setupStack(stack) {
  const cards = [...stack.querySelectorAll('.stack-card')];
  const count = stack.querySelector('[data-stack-count]');
  let order = cards.map((_, i) => i);
  let shown = 0;

  const layout = () => {
    order.forEach((cardIndex, depth) => {
      const card = cards[cardIndex];
      card.style.zIndex = String(cards.length - depth);
      card.style.setProperty('--r', STACK_TILT[Math.min(depth, STACK_TILT.length - 1)]);
      card.classList.toggle('buried', depth >= STACK_TILT.length);
    });
    if (count) count.textContent = `${(shown % cards.length) + 1} / ${cards.length}`;
  };

  const sendToBack = () => {
    order = [...order.slice(1), order[0]];
    shown += 1;
    layout();
  };

  stack.flip = direction => {
    if (cards.length < 2 || stack.querySelector('.leaving')) return;
    sfx('flip');
    if (direction < 0) {
      order = [order[order.length - 1], ...order.slice(0, -1)];
      shown = (shown + cards.length - 1) % cards.length;
      layout();
      return;
    }
    const top = cards[order[0]];
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return sendToBack();
    top.classList.add('leaving');
    top.addEventListener('animationend', () => {
      top.classList.remove('leaving');
      sendToBack();
    }, { once: true });
  };

  stack.addEventListener('click', () => stack.flip(1));
  layout();
}

function flipStack(direction) {
  frameEl.querySelector('[data-stack]')?.flip?.(direction);
}

const DIRECTION_KEYS = {
  ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
  KeyA: 'left', KeyD: 'right', KeyW: 'up', KeyS: 'down',
};

const directionOf = e => DIRECTION_KEYS[e.key] || DIRECTION_KEYS[e.code];

function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
}

addEventListener('keydown', e => {
  if (e.code === 'KeyF') { toggleFullscreen(); return; }
  if (e.code === 'KeyM') { toggleSound(); return; }

  if (state === 'room') {
    if (e.key === 'Escape' || e.code === 'Escape') { e.preventDefault(); closeRoom(); return; }
    const direction = directionOf(e);
    if (direction) { e.preventDefault(); keys.add(direction); }
    return;
  }
  if (state === 'doodle') {
    if (e.key === 'Escape' || e.code === 'Escape') { e.preventDefault(); closeDoodle(false); }
    return;
  }

  if (state === 'confirm') {
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Tab'].includes(e.key)) { e.preventDefault(); sfx('tick'); selectConfirm(1 - confirmChoice); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); answerConfirm(confirmChoice === 0); }
    else if (e.key === 'Escape') answerConfirm(false);
    return;
  }

  if (state === 'zoom') {
    if (e.key === 'ArrowRight') stepLightbox(1);
    else if (e.key === 'ArrowLeft') stepLightbox(-1);
    else if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); closeLightbox(); }
    return;
  }

  if (state === 'title') {
    if (e.key === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); selectChannel(selectedChannel + 1); }
    else if (e.key === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); selectChannel(selectedChannel - 1); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enterVillage(selectedChannel); }
    return;
  }

  if (state === 'deck') {
    if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); moveSlide(1); }
    else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); moveSlide(-1); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); flipStack(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); flipStack(-1); }
    else if (e.key === 'Escape') closeDeck();
    else if (e.key === 'Home') goToSlide(0, 'prev');
    return;
  }

  if (state !== 'play') return;
  const direction = directionOf(e);
  if (direction) {
    e.preventDefault();
    keys.add(direction);
    tappedKeys.add(direction);
    return;
  }
  if (e.repeat) return;
  const shortcut = portals.find(p => p.key === e.key);
  if (shortcut) {
    hero.x = shortcut.cx;
    hero.y = RETURN_Y;
    startWarp(shortcut);
    return;
  }
  if (e.key === 'Enter' || e.key === ' ') {
    const near = nearPortal();
    if (near) { e.preventDefault(); startWarp(near); return; }
    if (Math.hypot(hero.x - LINK_SIGN.x, hero.y - LINK_SIGN.y) < 26) { e.preventDefault(); openConfirm(); return; }
    if (interactNearby()) { e.preventDefault(); return; }
    if (e.key === ' ') { e.preventDefault(); jump(); }
  }
});

const lightboxEl = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
let lightbox = null;

function openLightbox() {
  const ready = billboardImages.filter(isLoaded);
  if (!ready.length) return;
  lightbox = { images: ready, index: currentBillboardIndex(), resume: state };
  keys.clear();
  state = 'zoom';
  sfx('open');
  lightboxEl.hidden = false;
  showLightboxImage();
}

function showLightboxImage() {
  const img = lightbox.images[lightbox.index];
  const k = Math.min(Math.min(innerWidth * 0.88, 1400) / img.naturalWidth, (innerHeight - 190) / img.naturalHeight);
  lightboxImg.style.width = `${Math.round(img.naturalWidth * k)}px`;
  lightboxImg.style.height = `${Math.round(img.naturalHeight * k)}px`;
  lightboxImg.src = img.src;
  document.getElementById('lightbox-count').textContent = `${lightbox.index + 1} / ${lightbox.images.length}`;
}

function stepLightbox(delta) {
  const count = lightbox.images.length;
  lightbox.index = (lightbox.index + delta + count) % count;
  sfx('tick');
  showLightboxImage();
}

function closeLightbox() {
  sfx('close');
  lightboxEl.hidden = true;
  state = lightbox.resume;
  lightbox = null;
}

function openLink() {
  window.open(LINK_SIGN.url, '_blank', 'noopener');
}

function hitTarget(e) {
  const dpr = window.devicePixelRatio || 1;
  const x = (e.clientX * dpr - ox) / scale;
  const y = (e.clientY * dpr - oy) / scale;
  const { x: bx, y: by, w, h } = BILLBOARD;
  if (x >= bx && x <= bx + w && y >= by && y <= by + h) return 'billboard';
  if (Math.abs(x - LINK_SIGN.x) <= 20 && y >= LINK_SIGN.y - 46 && y <= LINK_SIGN.y + 2) return 'link';
  if (x >= 134 && x <= 166 && y >= 186 && y <= 210) return 'sign';
  if (Math.abs(x - cat.x) <= 8 && y >= cat.y - 12 && y <= cat.y + 2) return 'cat';
  const tree = shakeTrees.findIndex(t => !t.hidden && Math.abs(x - t.x) <= 9 && y >= t.y - 16 && y <= t.y + 1);
  if (tree >= 0) return `tree:${tree}`;
  const door = houseKnocks.findIndex(h => x >= h.x + 14 && x <= h.x + 26 && y >= h.y + 12 && y <= h.y + 32);
  if (door >= 0) return `house:${door}`;
  return null;
}

view.addEventListener('mousemove', e => {
  hovering = state === 'play' ? hitTarget(e) : null;
  view.classList.toggle('pointing', hovering !== null);
});
view.addEventListener('mouseleave', () => {
  hovering = null;
  view.classList.remove('pointing');
});
view.addEventListener('click', e => {
  if (state !== 'play') return;
  const target = hitTarget(e);
  if (target === 'billboard') openLightbox();
  if (target === 'link') openConfirm();
  if (target === 'sign') openDoodle();
  if (target === 'cat') petCat();
  if (target?.startsWith('tree:')) kickTree(shakeTrees[Number(target.slice(5))]);
  if (target?.startsWith('house:')) {
    const index = Number(target.slice(6));
    if (eggs.unlocked) openRoom(index); else knockHouse(index);
  }
});

const confirmEl = document.getElementById('confirm');
const confirmButtons = [...confirmEl.querySelectorAll('[data-confirm]')];
let confirmChoice = 0;
document.getElementById('confirm-portrait').src = heroPortraitUrl;

function openConfirm() {
  keys.clear();
  hero.moving = false;
  state = 'confirm';
  sfx('open');
  confirmEl.hidden = false;
  selectConfirm(0);
}

function selectConfirm(index) {
  confirmChoice = index;
  confirmButtons.forEach((button, i) => button.classList.toggle('selected', i === index));
}

function answerConfirm(yes) {
  sfx(yes ? 'yes' : 'close');
  confirmEl.hidden = true;
  state = 'play';
  if (yes) openLink();
}

confirmEl.addEventListener('click', e => {
  const answer = e.target.closest('[data-confirm]')?.dataset.confirm;
  if (answer) answerConfirm(answer === 'yes');
});
lightboxEl.addEventListener('click', e => {
  const action = e.target.closest('[data-lightbox]')?.dataset.lightbox;
  if (action === 'prev') return stepLightbox(-1);
  if (action === 'next') return stepLightbox(1);
  if (action === 'close' || e.target === lightboxEl) closeLightbox();
});

addEventListener('keyup', e => {
  const direction = directionOf(e);
  if (tappedKeys.has(direction)) releasedKeys.add(direction);
  else keys.delete(direction);
});
addEventListener('blur', () => keys.clear());

const channelList = document.getElementById('channel-list');
let selectedChannel = 0;

function renderChannelList() {
  document.getElementById('channel-total').textContent = `${CONFIG.channels.length}개 채널`;
  channelList.innerHTML = CONFIG.channels.map((ch, i) => `
    <li><button class="channel${i === selectedChannel ? ' selected' : ''}" data-channel="${i}" role="option" aria-selected="${i === selectedChannel}">
      <span class="channel-arrow">▶</span>
      <span class="channel-name">${escapeHtml(ch.label)}${ch.isNew ? '<span class="channel-new">NEW</span>' : ''}</span>
      <span class="channel-portals">${ch.portals.map(p => escapeHtml(p.label)).join(' · ')}</span>
      <span class="channel-status"><span class="channel-bars"><b></b><b></b><b></b></span>원활</span>
    </button></li>`).join('');
}

function selectChannel(index, withSound = true) {
  selectedChannel = (index + CONFIG.channels.length) % CONFIG.channels.length;
  renderChannelList();
  setChannel(CONFIG.channels[selectedChannel]);
  if (withSound) sfx('tick');
}

channelList.addEventListener('click', e => {
  const button = e.target.closest('[data-channel]');
  if (!button) return;
  selectChannel(Number(button.dataset.channel), false);
  enterVillage(selectedChannel);
});
channelList.addEventListener('mouseover', e => {
  const button = e.target.closest('[data-channel]');
  if (button && Number(button.dataset.channel) !== selectedChannel) selectChannel(Number(button.dataset.channel), false);
});
selectChannel(0, false);
frameEl.addEventListener('click', e => {
  if (e.target.closest('[data-dialogue-next]')) return moveSlide(1);
  const target = e.target.closest('[data-goto]');
  if (target) goToSlide(Number(target.dataset.goto), 'next');
});
deckEl.querySelector('.deck-nav').addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]')?.dataset.nav;
  if (nav === 'prev') moveSlide(-1);
  if (nav === 'next') moveSlide(1);
  if (nav === 'exit') closeDeck();
});

addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault();
  const file = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
  if (!file) return;
  billboardImages.splice(0, billboardImages.length, loadImage(URL.createObjectURL(file)));
});

function makeLedPattern() {
  const cell = Math.max(3, Math.round(scale * 0.75));
  const c = makeCanvas(cell, cell);
  const x = c.getContext('2d');
  x.fillStyle = 'rgba(0, 0, 0, 0.26)';
  x.fillRect(cell - 1, 0, 1, cell);
  x.fillRect(0, cell - 1, cell, 1);
  return ctx.createPattern(c, 'repeat');
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  view.width = Math.round(innerWidth * dpr);
  view.height = Math.round(innerHeight * dpr);
  scale = Math.min(view.width / W, view.height / H);
  ox = Math.round((view.width - W * scale) / 2);
  oy = Math.round((view.height - H * scale) / 2);
  ledPattern = makeLedPattern();
}
addEventListener('resize', () => {
  resize();
  if (lightbox) showLightboxImage();
});
resize();

document.getElementById('deck-hero').src = heroPortraitUrl;
document.fonts?.load('16px Galmuri11');
document.fonts?.load('700 16px Galmuri11');

let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min((now - last) / 1000, 0.05));
  last = now;
  time += dt;
  try {
    if (state === 'play') updatePlay(dt);
    else if (state === 'warp') updateWarp(dt);
    else if (state === 'intro') updateIntro(dt);
    updateFade();
    if (state === 'deck') updateTyping();
    if (state === 'deck') updateArena(dt);
    if (state === 'deck') updateStamina(dt);
    updateBgm();
    spawnParticles(dt);
    if (state !== 'deck') updateEasterEggs(dt);
    updateJump(dt);
    if (state === 'room') updateRoom(dt);
    if (state !== 'deck') render();
  } finally {
    requestAnimationFrame(frame);
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
