<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>예술in 마을</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
  :root {
    --ink: #1d1626;
    --paper: #fbf9f4;
    --brand: #246bfe;
    --brand-deep: #194fc4;
    --night: #0f1424;
    --accent: var(--brand);
    --accent-deep: var(--brand-deep);
    --accent-soft: #cfe0ff;
    --pixel-font: 'Galmuri11', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #14281c; color: #fff; font-family: var(--pixel-font); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  [hidden] { display: none !important; }

  #view { display: block; width: 100vw; height: 100dvh; image-rendering: pixelated; }

  /* 시작 화면 */
  .title-screen {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: radial-gradient(ellipse at center, rgba(15, 20, 36, .55), rgba(15, 20, 36, .88));
  }
  .title-card { display: grid; justify-items: center; gap: 1.2rem; text-align: center; padding: 0 16px; width: min(100%, 720px); }
  .title-sub { font-size: clamp(16px, 2vw, 22px); color: #cfe0ff; letter-spacing: .08em; }
  .title-logo {
    font-weight: 700; line-height: 1.05;
    font-size: clamp(56px, 9vw, 128px);
    color: #fff;
    text-shadow: .06em .06em 0 var(--brand), .12em .12em 0 #0b1a4a;
  }
  .title-hint { font-size: 14px; color: #9fb0d6; }
  .channel-panel {
    width: 100%; margin-top: .4rem; text-align: left; background: rgba(15, 20, 36, .92);
    box-shadow: 0 0 0 4px var(--ink), 0 0 0 7px #fff, 8px 8px 0 7px rgba(0, 0, 0, .4);
  }
  .channel-head { display: flex; justify-content: space-between; padding: .7rem 1rem; font-size: 15px; color: #cfe0ff; background: #2d3352; }
  .channel-list { list-style: none; display: grid; }
  .channel {
    display: grid; grid-template-columns: 1.4rem 1fr auto; align-items: center; gap: .3rem 1rem; width: 100%;
    padding: .9rem 1rem; text-align: left; box-shadow: inset 0 -1px 0 rgba(255, 255, 255, .1);
  }
  .channel:hover, .channel.selected { background: rgba(36, 107, 254, .28); }
  .channel-arrow { grid-row: span 2; color: #ffd34d; visibility: hidden; animation: blink 1s steps(2) infinite; }
  .channel.selected .channel-arrow { visibility: visible; }
  .channel-name { display: flex; align-items: center; gap: .6rem; font-size: clamp(18px, 2.2vw, 24px); font-weight: 700; color: #fff; }
  .channel-new { padding: .1rem .45rem; font-size: 12px; color: var(--ink); background: #ffd34d; }
  .channel-portals { grid-column: 2; font-size: 14px; color: #9fb0d6; }
  .channel-status { grid-row: 1 / span 2; grid-column: 3; display: flex; align-items: center; gap: .5rem; font-size: 14px; color: #7bf18a; }
  .channel-bars { display: flex; align-items: flex-end; gap: 3px; }
  .channel-bars b { width: 5px; background: currentColor; }
  .channel-bars b:nth-child(1) { height: 6px; }
  .channel-bars b:nth-child(2) { height: 10px; }
  .channel-bars b:nth-child(3) { height: 14px; opacity: .35; }

  /* 마을 HUD */
  .hud { position: fixed; inset: 0; pointer-events: none; }
  .hud-top { position: absolute; top: 16px; left: 16px; display: flex; gap: 14px; align-items: center; }
  .hud-place {
    padding: .5rem .9rem; font-size: 15px;
    background: rgba(15, 20, 36, .82); box-shadow: 0 0 0 3px var(--ink), 0 0 0 5px rgba(255, 255, 255, .85);
  }
  .hud-keys {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 1.2rem; flex-wrap: wrap; justify-content: center;
    padding: .55rem 1rem; font-size: 14px; color: #e6ecff; white-space: nowrap;
    background: rgba(15, 20, 36, .78);
  }
  kbd {
    display: inline-block; min-width: 1.6em; padding: .1em .35em; margin-right: .25em; text-align: center;
    font: inherit; color: var(--ink); background: var(--paper); box-shadow: 0 2px 0 #8a8fa3;
  }

  /* 슬라이드 */
  .deck {
    position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; gap: 1rem;
    padding: 18px 24px 16px;
    background:
      radial-gradient(circle at 20% 15%, rgba(255, 255, 255, .06) 0 1px, transparent 2px) 0 0 / 46px 46px,
      radial-gradient(circle at 70% 60%, rgba(255, 255, 255, .05) 0 1px, transparent 2px) 0 0 / 71px 71px,
      var(--night);
  }
  .deck-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; font-size: 16px; }
  .deck-badge { display: inline-flex; align-items: center; gap: .7rem; padding: .35rem .8rem .35rem .45rem; background: var(--accent); color: var(--ink); }
  .deck-badge img { width: 32px; height: 32px; image-rendering: pixelated; }
  .deck-count { color: #c6cde6; }
  .deck-stage { display: grid; place-items: center; min-height: 0; }
  .slide-frame {
    position: relative; overflow: hidden;
    width: min(calc(100vw - 72px), calc((100dvh - 170px) * 16 / 9));
    aspect-ratio: 16 / 9;
    background: var(--paper); color: var(--ink);
    container-type: size;
    box-shadow: 0 0 0 6px var(--ink), 0 0 0 12px var(--accent), 14px 14px 0 12px rgba(0, 0, 0, .4);
  }
  .slide { position: absolute; inset: 0; padding: 7cqh 6.5cqw; display: flex; flex-direction: column; gap: 3.2cqh; }
  .slide.from-next { animation: in-next .28s steps(4) both; }
  .slide.from-prev { animation: in-prev .28s steps(4) both; }
  .slide-kicker { font-size: 1.7cqw; color: var(--accent-deep); }
  .slide-title { font-weight: 700; font-size: 4.4cqw; line-height: 1.25; }
  .slide-subtitle { font-size: 2.3cqw; line-height: 1.5; color: #4f4a5e; }
  .slide-points { list-style: none; display: grid; gap: 2.6cqh; font-size: 2.45cqw; line-height: 1.5; }
  .slide-points li { position: relative; padding-left: 3cqw; }
  .slide-points li::before {
    content: ''; position: absolute; left: 0; top: .48em; width: 1.05cqw; height: 1.05cqw;
    background: var(--accent); box-shadow: .25cqw .25cqw 0 var(--ink);
  }
  .slide mark { color: inherit; background: linear-gradient(transparent 58%, var(--accent-soft) 58%); }
  .slide--cover { justify-content: center; }
  .slide--cover .slide-title { font-size: 7.6cqw; }
  .slide--cover .slide-subtitle { font-size: 2.7cqw; max-width: 60ch; }
  .slide--split { display: grid; grid-template-columns: 1.05fr 1fr; align-items: center; gap: 4.5cqw; }
  .slide-text { display: flex; flex-direction: column; gap: 3.2cqh; }
  .slide-media { display: grid; grid-template-rows: 1fr auto; gap: 1.6cqh; min-height: 0; height: 100%; }
  .slide--split .slide-media { height: 76cqh; }
  .slide--media .slide-media { flex: 1; }
  .slide-media img { width: 100%; height: 100%; min-height: 0; object-fit: contain; }
  .slide-media figcaption { font-size: 1.6cqw; color: #4f4a5e; text-align: center; }
  .slide--sequence { gap: 2.8cqh; }
  .sequence-panels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.5cqw; min-height: 0; }
  .sequence-panel { position: relative; min-width: 0; padding: 1.5cqh 1cqw; background: #f3edf9; border: .16cqw solid #cbb8e7; border-radius: .8cqw; }
  .sequence-panel + .sequence-panel::before { content: '→'; position: absolute; top: 45%; left: -2.35cqw; color: var(--accent-deep); font-size: 2.2cqw; }
  .sequence-panel.is-pending { background: transparent; border-style: dashed; border-color: #d8d2dd; }
  .sequence-panel.is-pending .sequence-label { color: #82798d; }
  .sequence-panel.is-pending .sequence-visual { visibility: hidden; }
  .sequence-label { font-size: 1.8cqw; font-weight: 700; margin-bottom: 1.2cqh; }
  .sequence-label span { color: var(--accent-deep); margin-right: .65cqw; }
  .sequence-visual { width: 100%; aspect-ratio: 350 / 290; }
  .sequence-visual img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .sequence-panel.is-entering .sequence-visual { animation: sequence-reveal .4s ease both; }
  .sequence-controls { display: flex; justify-content: space-between; align-items: center; gap: 1cqw; font-size: 1.45cqw; color: #655c70; }
  .sequence-controls strong { font-size: 1.7cqw; color: var(--accent-deep); }
  .slide--salon { gap: 1.8cqh; padding-top: 4.5cqh; word-break: keep-all; }
  .slide--salon .slide-title { font-size: 3.65cqw; }
  .salon-steps { display: flex; gap: .8cqw; }
  .salon-step { flex: 1; padding: .8cqh 1cqw; border-bottom: .24cqw solid #d4c9c1; color: #81746e; font-size: 1.5cqw; }
  .salon-step.is-done { border-color: var(--accent); color: var(--ink); }
  .salon-step.is-current { background: var(--accent-soft); font-weight: 700; }
  .salon-scene { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 9cqw 1.2fr; gap: 1.2cqw; }
  .salon-card { position: relative; min-height: 0; width: 76%; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: .6cqh; transition: transform .6s ease; }
  .salon-card img { width: 100%; flex: 1; min-height: 0; object-fit: contain; }
  .salon-card figcaption, .salon-caption { font-size: 1.2cqw; color: #75635c; text-align: center; }
  .salon-label { font-size: 1.5cqw; color: var(--accent-deep); }
  .salon-link { align-self: center; position: relative; border-top: .25cqw dashed #c4b5ad; transition: border-color .4s ease; }
  .salon-link::after { content: ''; position: absolute; right: 0; top: -.62cqw; border-left: .9cqw solid #c4b5ad; border-top: .5cqw solid transparent; border-bottom: .5cqw solid transparent; }
  .salon-scene:not([data-mode="card"]):not([data-mode="upload"]) .salon-link { border-color: var(--accent-deep); border-top-style: solid; }
  .salon-scene:not([data-mode="card"]):not([data-mode="upload"]) .salon-link::after { border-left-color: var(--accent-deep); }
  .salon-scene:not([data-mode="card"]) .salon-card { transform: translateX(5%); }
  .salon-phone { position: relative; width: 25cqw; justify-self: center; min-height: 0; border: .35cqw solid var(--ink); border-radius: 1.6cqw; background: #fff; overflow: hidden; }
  .salon-phone::before { content: ''; position: absolute; z-index: 1; width: 4cqw; height: .45cqh; border-radius: 1cqw; background: var(--ink); top: 1cqh; left: calc(50% - 2cqw); }
  .phone-view { position: absolute; inset: 2.2cqh 1.8cqw 1cqh; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 1.4cqh; opacity: 0; visibility: hidden; transform: translateY(1cqh); transition: opacity .35s ease, transform .35s ease; }
  .phone-view.is-current { opacity: 1; visibility: visible; transform: none; }
  .phone-view strong { font-size: 2cqw; }
  .phone-view p { font-size: 1.5cqw; color: #75635c; }
  .phone-qr { position: relative; width: 8cqw; height: 8cqw; max-height: 16cqh; color: var(--ink); }
  .phone-qr svg { width: 100%; height: 100%; }
  [data-mode="scan"] .phone-qr::after { content: ''; position: absolute; left: 0; right: 0; height: .35cqh; background: var(--accent-deep); animation: salon-scan .8s ease both; }
  .profile-initial { display: grid; place-items: center; width: 5cqw; height: 5cqw; background: var(--accent-soft); border: .2cqw solid var(--accent); border-radius: 50%; font-size: 2.4cqw; }
  .profile-entry { padding: 1cqh 1cqw; background: #f7f2ed; width: 100%; text-align: center; font-size: 1.45cqw; }
  .profile-new { color: #21765a; background: #e5f4ec; display: none; }
  [data-mode="updated"] .profile-new { display: block; animation: salon-rise .4s ease both; }
  [data-mode="updated"] .profile-initial { display: none; }
  .profile-fixed { position: absolute; bottom: 1cqh; left: 0; width: 100%; padding: .7cqh; background: var(--accent-soft); font-size: 1.4cqw; text-align: center; opacity: 0; }
  [data-mode="updated"] .profile-fixed { opacity: 1; }
  .salon-document { align-self: center; justify-self: center; width: 19cqw; height: 23cqh; border: .25cqw solid var(--ink); background: #fff; padding: 2cqh 1.4cqw; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2cqh; transition: transform .5s ease; }
  .salon-document strong { font-size: 4cqw; color: var(--accent-deep); }
  .salon-document span { font-size: 1.65cqw; }
  .salon-document i { display: block; width: 80%; height: .5cqh; background: #ded6d1; box-shadow: 0 1.4cqh #ded6d1; }
  .salon-scene--review { grid-template-columns: .7fr 6cqw 1.5fr; }
  .salon-scene--review:not([data-mode="upload"]) .salon-document { transform: translateX(7%); }
  .review-window { min-height: 0; display: flex; flex-direction: column; border: .2cqw solid #c4b5ad; background: #fff; }
  .review-window h3 { font-size: 1.75cqw; padding: 1cqh 1.4cqw; background: var(--accent-soft); }
  .review-crop { flex: 1; min-height: 0; position: relative; overflow: hidden; background: #f5f8fc; }
  .review-crop img { position: absolute; width: 300%; max-width: none; height: auto; left: -210%; top: -104cqh; opacity: 1; transition: left .65s ease, top .65s ease, width .65s ease, opacity .3s ease; }
  [data-mode="upload"] .review-crop img { opacity: 0; }
  [data-mode="judge"] .review-crop img { width: 190%; left: -20%; top: -84cqh; }
  .review-placeholder { position: absolute; inset: 0; display: grid; place-items: center; color: #8a7d76; font-size: 1.8cqw; }
  .salon-scene--review:not([data-mode="upload"]) .review-placeholder { display: none; }
  .review-caption { padding: .7cqh 1cqw; font-size: 1.3cqw; text-align: center; color: #75635c; }
  .followup-grid { display: grid; grid-template-columns: 7cqw repeat(3, 1fr); grid-template-rows: auto 1fr 1fr; gap: 1.3cqh 1cqw; flex: 1; min-height: 0; }
  .followup-head { font-size: 1.7cqw; text-align: center; padding: 1.2cqh .5cqw; border-bottom: .24cqw solid #c4b5ad; color: #81746e; }
  .followup-head.is-current { background: var(--accent-soft); color: var(--ink); border-color: var(--accent-deep); }
  .followup-track { align-self: center; font-size: 1.8cqw; color: var(--accent-deep); }
  .followup-cell { display: grid; place-items: center; background: #fff; border: .15cqw solid #c4b5ad; padding: 1.3cqh .7cqw; font-size: 1.8cqw; line-height: 1.55; text-align: center; }
  .followup-cell span { transition: opacity .35s ease, transform .35s ease; }
  .followup-cell.is-pending { border-style: dashed; background: transparent; }
  .followup-cell.is-pending span { opacity: 0; transform: translateY(1cqh); visibility: hidden; }
  .followup-cell.is-current { border-color: var(--accent-deep); box-shadow: 0 .35cqh var(--accent-soft); }
  @keyframes salon-scan { from { top: 0; } to { top: 96%; } }
  @keyframes salon-rise { from { opacity: 0; transform: translateY(1cqh); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .slide--salon * { animation: none !important; transition: none !important; } }
  .slide--handoff { gap: 2.8cqh; }
  .handoff { flex: 1; min-height: 0; background: #f3edf9; border-radius: 1cqw; }
  .handoff svg { display: block; width: 100%; height: 100%; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  .handoff-node { fill: #fff; stroke: #cbb8e7; stroke-width: 2.5; }
  .handoff-label { fill: #28213c; font-size: 29px; font-weight: 750; }
  .handoff-detail { fill: #736a83; font-size: 24px; }
  .handoff-path { fill: none; stroke: #b9aec9; stroke-width: 5; stroke-dasharray: 9 8; }
  .handoff-live { opacity: 0; transition: opacity .4s ease; }
  .handoff-live.is-serving { opacity: 1; }
  .handoff-live path { fill: none; stroke: #187863; stroke-width: 5; }
  .handoff-live .handoff-packets { stroke: #fff; stroke-width: 7; stroke-dasharray: 1 46; stroke-linecap: round; animation: handoff-requests 1.4s linear infinite; }
  .handoff-server .server-body { fill: #fae9ed; stroke: #b74456; stroke-width: 2.5; transition: fill .4s ease, stroke .4s ease; }
  .handoff-server .server-icon { color: #b74456; transition: color .4s ease; }
  .handoff-server.is-serving .server-body { fill: #e0f1e8; stroke: #187863; }
  .handoff-server.is-serving .server-icon { color: #187863; }
  .handoff-server .server-status { opacity: 1; transition: opacity .25s ease; }
  .handoff-server .server-status--serving { opacity: 0; }
  .handoff-server.is-serving .server-status--serving { opacity: 1; }
  .handoff-server.is-serving .server-status--deploying { opacity: 0; }
  .handoff-server .server-status text:first-child { font-size: 31px; font-weight: 800; }
  .server-status--serving { fill: #187863; }
  .server-status--deploying { fill: #b74456; }
  .handoff-server[data-phase="working"] .server-body { fill: #fff0d8; stroke: #a16a18; }
  .handoff-server[data-phase="working"] .server-icon { color: #a16a18; }
  .handoff-server[data-phase="working"] .server-status--deploying { fill: #a16a18; }
  .handoff-server[data-phase="recovering"] .server-body { fill: #eee5fb; stroke: #7450b4; }
  .handoff-server[data-phase="recovering"] .server-icon { color: #7450b4; }
  .handoff-server[data-phase="recovering"] .server-status--deploying { fill: #7450b4; }
  .server-icon-lines, .server-mark { transition: opacity .3s ease; }
  .server-mark { opacity: 0; }
  .handoff-server:is([data-phase="failed"], [data-phase="recovering"]) .server-icon-lines { opacity: 0; }
  .handoff-server[data-phase="failed"] .server-mark--failed,
  .handoff-server[data-phase="recovering"] .server-mark--recovering { opacity: 1; }
  .handoff.is-animated [data-phase="failed"] .server-icon { animation: handoff-failure .4s ease; }
  .handoff.is-animated [data-phase="recovering"] .server-mark--recovering { transform-box: fill-box; transform-origin: center; animation: handoff-recover .8s ease; }
  @keyframes handoff-failure { 25%, 75% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }
  @keyframes handoff-recover { from { transform: rotate(-180deg); } to { transform: rotate(0); } }
  /* Finish A's return before B leaves; this animation never advances the slide. */
  .handoff.is-switching [data-handoff-server="1"] :is(.server-body, .server-icon, .server-status),
  .handoff.is-switching [data-handoff-path="1"] { transition-delay: .7s; }
  .slide--schema { gap: 2.8cqh; }
  .schema { flex: 1; min-height: 0; background: #f3edf9; border-radius: 1cqw; }
  .schema svg { display: block; width: 100%; height: 100%; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  .schema-box { fill: #fff; stroke: #cbb8e7; stroke-width: 2.5; transition: stroke .4s ease; }
  .schema-heading { fill: #28213c; font-size: 35px; font-weight: 750; }
  .schema-detail { fill: #736a83; font-size: 24px; }
  .schema-code-state { opacity: 0; transform: translateY(-12px); transition: opacity .25s ease, transform .4s ease; }
  .schema-code-state.is-current { opacity: 1; transform: translateY(0); }
  .schema-status { fill: #e0f1e8; transition: fill .4s ease; }
  .schema-status-text { fill: #187863; font-size: 27px; font-weight: 750; }
  .schema-column-slot { fill: #f5f2f8; stroke: #aaa0b5; stroke-width: 2; stroke-dasharray: 5 5; transition: stroke .4s ease; }
  .schema-column { opacity: 1; transform: translateY(0); transition: opacity .4s ease, transform .4s ease; }
  .schema.is-animated .schema-column { transition-delay: calc(var(--column) * .08s); }
  .schema-column rect { fill: #e0f1e8; stroke: #187863; stroke-width: 2; }
  .schema-column path { fill: none; stroke: #187863; stroke-width: 3; }
  .schema.is-missing .schema-column { opacity: 0; transform: translateY(16px); }
  .schema-missing-mark { opacity: 0; fill: #81758f; font-size: 34px; transition: opacity .4s ease; }
  .schema.is-missing .schema-missing-mark { opacity: 1; }
  .schema-connection { color: #187863; transition: color .4s ease; }
  .schema-link { fill: none; stroke: currentColor; stroke-width: 5; }
  .schema-link-label { fill: currentColor; font-size: 24px; font-weight: 700; }
  .schema.is-unused .schema-connection { color: #9b8eaf; }
  .schema.is-unused .schema-link-line { stroke-dasharray: 9 8; }
  .schema-break { opacity: 0; transition: opacity .3s ease; }
  .schema-break circle { fill: #f3edf9; }
  .schema-check-sweep { opacity: 0; fill: none; stroke: #fff; stroke-width: 6; stroke-dasharray: 16 320; }
  .schema.is-checking.is-animated .schema-check-sweep { animation: schema-check 1s ease both; }
  .schema.is-failed .schema-code-box { stroke: #b74456; }
  .schema.is-failed .schema-status { fill: #fae0e6; }
  .schema.is-failed :is(.schema-status-text, .schema-missing-mark, [data-schema-db-detail]) { fill: #b74456; }
  .schema.is-failed .schema-column-slot { stroke: #b74456; }
  .schema.is-failed .schema-connection { color: #b74456; }
  .schema.is-failed .schema-break { opacity: 1; }
  .schema:not(.is-animated) * { transition: none; }
  @keyframes schema-check { 0% { opacity: 0; stroke-dashoffset: 0; } 15%, 85% { opacity: 1; } 100% { opacity: 0; stroke-dashoffset: -320; } }
  @keyframes handoff-requests { to { stroke-dashoffset: -94; } }

</style>

<canvas id="view" aria-label="예술in 마을 지도"></canvas>

<script>
/*
  발표 내용은 CONFIG만 고치면 된다.
  - billboard.images: 전광판에 번갈아 나오는 사진들 (이미지를 화면에 끌어다 놓아도 바뀐다)
  - channels: 시작 화면의 채널(스프린트) 목록. 채널마다 portals 배열이 마을의 포탈이 되고, 포탈 수에 맞춰 마을이 다시 그려진다.
    포탈: { slides: 'PORTAL_SLIDES 키', file: '슬라이드 파일 경로', label, theme: 'pink' | 'gold' | 'sky' | 'mint' | 'violet' | 'coral' }
    채널이나 포탈을 늘리고 줄일 때는 이 목록과 슬라이드 파일만 고치면 된다. 파일은 채널에 들어갈 때 불러온다.
  - 첫 장 목차는 type: 'act' 슬라이드에서 자동으로 만들어진다.
  - 포탈에 sectionStyle: 'plain'을 지정하면 막 대신 번호와 구역 제목을 표시한다. tocTitle로 목차 제목을 바꿀 수 있다.
  - sectionIntro: 'stage'를 함께 지정하면 번호형 구역의 도입을 커튼이 열리는 무대로 표시한다.
  - 슬라이드 필드
    type: 'act' | 'hypothesis' | 'compare' | 'gaps' | 'cycle' | 'flow' | 'cards' | 'crossroads' | 'dialogue' | 'table' | 'chat' | 'arena' | 'stamina' | 'sensors' | 'sequence' (생략하면 내용에 맞춰 자동 배치)
    kicker, title, subtitle, big, points, image, caption, images(사진 더미), claims, before/after, say(캐릭터 대사)
    cards: [{ label, title, detail }], takeaway: 카드나 대화의 정리 문장
    turns: [{ speaker: '대O' | '맥O', label, text, note, thought }], scene: 'goals' | 'request' | 'reunion'
    sequence: stages: [{ label, image, alt, note, say }], 다음/이전으로 그림을 한 단계씩 공개한다.
    sequence + layout: 'handoff': source/router: { label, detail }, servers: [A, B], stages: [{ serving: 0 | 1 | [0, 1], servingDetail, servingLabel?, note, say }]. 같은 그림에서 요청 경로와 서버 상태를 교대한다.
    handoff의 단계별 serverStates?: [{ status, detail, phase?: 'working' | 'failed' | 'recovering' }, ...]로 서버별 설명과 실패/복구 표시를 바꿀 수 있다.
    sequence + layout: 'schema': database, columnCount, description, stages: [{ code, codeDetail, codeStatus, columns: boolean, dbDetail, connection, mode: 'linked' | 'unused' | 'checking' | 'failed', note, say }]. 같은 코드·DB 그림에서 컬럼 유지/삭제와 호환성을 보여준다.
    sequence + layout: 'profile-link' | 'review-demo' | 'followup': 같은 장면에서 명함 연결, 심사 화면 확대, 대상별 확인 시점을 단계별로 보여준다. stages의 label, mode/cells, note, say는 포탈 파일에서 작성한다.
    crossroads와 dialogue가 이어지면 같은 무대에서 캐릭터와 말풍선을 이동한다. dialogue는 대화와 악수를 순서대로 공개한다.
    **강조**는 형광펜으로 표시된다.
*/
const CONFIG = {
  narrator: '예술in',
  billboard: {
    images: ['assets/billboard.png', 'assets/billboard1.jpg', 'assets/billboard2.jpg'],
    interval: 6,
    ledEffect: true,
    fallbackText: '예술in에 오신 것을 환영합니다!   포탈로 걸어 들어가 보세요',
  },
  channels: [
    {
      id: 'sprint2', label: '스프린트 2',
      portals: [
        { slides: 'soft', file: 'slides/soft.js', label: '소프트 스킬', theme: 'pink' },
        { slides: 'product', file: 'slides/product.js', label: '제품', theme: 'gold' },
        { slides: 'tech', file: 'slides/tech.js', label: '기술', theme: 'sky' },
      ],
    },
    {
      id: 'sprint3', label: '스프린트 3', isNew: true,
      portals: [
        { slides: 'story-a', file: 'slides/sprint3/story-a.js', label: '스토리 A', theme: 'mint' },
        { slides: 'story-b', file: 'slides/sprint3/story-b.js', label: '스토리 B', theme: 'violet' },
        { slides: 'story-c', file: 'slides/sprint3/story-c.js', label: '스토리 C', theme: 'coral' },
      ],
    },
  ],
};

const ACTS = {
  1: { num: '1막', role: '지난 무대' },
  2: { num: '2막', role: '지금 무대' },
  3: { num: '3막', role: '다음 무대' },
};

const W = 384, H = 240;
const SPEED = 78;
const PORTAL_THEMES = {
  pink: { accent: '#ff7ab6', accentDeep: '#c2306f', accentSoft: '#ffd6e8', palette: ['#ff6fae', '#ffb3d6', '#c93a83', '#fff0f7'] },
  gold: { accent: '#ffb938', accentDeep: '#b86a00', accentSoft: '#ffe7b0', palette: ['#ffb238', '#ffd66b', '#e07a12', '#fff4cc'] },
  sky: { accent: '#4cc8ff', accentDeep: '#1662c9', accentSoft: '#cdeeff', palette: ['#3fd0ff', '#9be9ff', '#246bfe', '#e6fbff'] },
  mint: { accent: '#5fd3a0', accentDeep: '#16805a', accentSoft: '#cdf3e1', palette: ['#4fcf96', '#a6efcd', '#1f9a68', '#eafff4'] },
  violet: { accent: '#b48cff', accentDeep: '#6a3fc7', accentSoft: '#e7dcff', palette: ['#a57dff', '#d4c2ff', '#7246d6', '#f5f0ff'] },
  coral: { accent: '#ff8a6b', accentDeep: '#c2452a', accentSoft: '#ffddd3', palette: ['#ff7a57', '#ffb9a6', '#d24c2f', '#fff1ec'] },
};
const THEME_ORDER = Object.keys(PORTAL_THEMES);
let PORTAL_X = [];
const PORTAL_TOP = 112;
const SPAWN = { x: 192, y: 212 };

function unlockAudio() {
  if (SOUND.ctx) {
    if (SOUND.ctx.state === 'suspended') SOUND.ctx.resume();
    return;
  }
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtx) return;
  const ctx = new AudioCtx();
  const master = ctx.createGain();
  master.gain.value = SOUND.muted ? 0 : MASTER_VOLUME;
  master.connect(ctx.destination);
  const bgmGain = ctx.createGain();
  bgmGain.gain.value = 0;
  bgmGain.connect(master);
  Object.assign(SOUND, { ctx, master, bgmGain });
}

function noteFrequency(name) {
  const [, letter, sharp, octave] = /^([A-G])(#?)(\d)$/.exec(name);
  const semitone = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[letter] + (sharp ? 1 : 0);
  return 440 * 2 ** ((12 * (Number(octave) + 1) + semitone - 69) / 12);
}

function tone(frequency, at, duration, { type = 'square', volume = 0.1, slideTo = null, destination = SOUND.master } = {}) {
  const { ctx } = SOUND;
  const oscillator = ctx.createOscillator();
  const envelope = ctx.createGain();
  oscillator.type = type;
  oscillator.frequency.setValueAtTime(frequency, at);
  if (slideTo) oscillator.frequency.exponentialRampToValueAtTime(slideTo, at + duration);
  envelope.gain.setValueAtTime(0.0001, at);
  envelope.gain.exponentialRampToValueAtTime(volume, at + 0.01);
  envelope.gain.exponentialRampToValueAtTime(0.0001, at + duration);
  oscillator.connect(envelope).connect(destination);
  oscillator.start(at);
  oscillator.stop(at + duration + 0.02);
}

const SFX = {

  next: [['A5'], 0.04, { volume: 0.1 }],
  prev: [['E5'], 0.04, { volume: 0.1 }],
  open: [['G5', 'D6'], 0.06, { volume: 0.12 }],
  tick: [['C6'], 0.02, { volume: 0.07 }],
  yes: [['C6', 'E6', 'G6'], 0.06, { volume: 0.14, type: 'triangle' }],

};

function sfx(name) {
  if (!SOUND.ctx || SOUND.muted) return;
  const at = SOUND.ctx.currentTime + 0.01;
  if (name === 'warp') {
    tone(220, at, 0.7, { type: 'triangle', volume: 0.22, slideTo: 1760 });
    tone(330, at + 0.05, 0.65, { volume: 0.05, slideTo: 2640 });
    return;
  }
  if (name === 'jump') {
    tone(330, at, 0.16, { type: 'square', volume: 0.08, slideTo: 880 });
    return;
  }
  if (name === 'meow') {
    tone(700, at, 0.18, { type: 'triangle', volume: 0.14, slideTo: 1100 });
    tone(1000, at + 0.18, 0.28, { type: 'triangle', volume: 0.12, slideTo: 560 });
    return;
  }
  if (name === 'thud') {
    tone(160, at, 0.18, { type: 'square', volume: 0.12, slideTo: 60 });
    return;
  }
  if (name === 'knock') {
    tone(220, at, 0.07, { type: 'square', volume: 0.12, slideTo: 120 });
    tone(220, at + 0.16, 0.07, { type: 'square', volume: 0.12, slideTo: 120 });
    return;
  }
  if (name === 'boom') {
    tone(240, at, 0.3, { type: 'triangle', volume: 0.1, slideTo: 50 });
    tone(1800, at + 0.05, 0.25, { type: 'square', volume: 0.025, slideTo: 2400 });
    return;
  }
  if (name === 'flatline') {
    tone(988, at, 1.6, { type: 'sine', volume: 0.12 });
    return;
  }
  if (name === 'flip') {
    tone(1400, at, 0.08, { type: 'triangle', volume: 0.12, slideTo: 500 });
    return;
  }
  const [notes, gap, options] = SFX[name];
  notes.forEach((note, i) => tone(noteFrequency(note), at + i * gap, gap * 1.6, options));
}

function setBgm(on) {
  SOUND.bgmOn = on;
  const { ctx, bgmGain } = SOUND;
  if (!ctx) return;
  const now = ctx.currentTime;
  bgmGain.gain.cancelScheduledValues(now);
  bgmGain.gain.setValueAtTime(bgmGain.gain.value, now);
  bgmGain.gain.linearRampToValueAtTime(on ? 1 : 0, now + (on ? 1.2 : 0.5));
}

function updateBgm() {
  const { ctx, bgmGain } = SOUND;
  if (!ctx || !SOUND.bgmOn) return;
  if (SOUND.nextStep < ctx.currentTime) SOUND.nextStep = ctx.currentTime + 0.05;
  while (SOUND.nextStep < ctx.currentTime + 0.25) {
    const i = SOUND.step % BGM_LEAD.length;
    const at = SOUND.nextStep;
    if (BGM_LEAD[i] !== '-') tone(noteFrequency(BGM_LEAD[i]), at, BGM_STEP * 0.9, { volume: 0.05, destination: bgmGain });
    if (i % 2 === 0) tone(noteFrequency(BGM_BASS[i / 2 % BGM_BASS.length]), at, BGM_STEP * 1.8, { type: 'triangle', volume: 0.12, destination: bgmGain });
    SOUND.step += 1;
    SOUND.nextStep += BGM_STEP;
  }
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function mulberry32(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function sprite(rows, palette) {
  const c = makeCanvas(Math.max(...rows.map(r => r.length)), rows.length);
  const x = c.getContext('2d');
  rows.forEach((row, y) => [...row].forEach((ch, i) => {
    if (!palette[ch]) return;
    x.fillStyle = palette[ch];
    x.fillRect(i, y, 1, 1);
  }));
  return c;
}

function flipped(src) {
  const c = makeCanvas(src.width, src.height);
  const x = c.getContext('2d');
  x.translate(src.width, 0);
  x.scale(-1, 1);
  x.drawImage(src, 0, 0);
  return c;
}

const loadedFiles = new Map();

function loadScript(src) {
  if (!loadedFiles.has(src)) {
    loadedFiles.set(src, new Promise(resolve => {
      const el = document.createElement('script');
      el.src = src;
      el.onload = resolve;
      el.onerror = () => { console.warn(`슬라이드 파일을 불러오지 못했어요: ${src}`); resolve(); };
      document.head.appendChild(el);
    }));
  }
  return loadedFiles.get(src);
}

const loadChannel = next => Promise.all(next.portals.filter(p => p.file).map(p => loadScript(p.file)));

function onPath(x, y) {
  const [pathLeft, pathRight] = mainPathRange();
  if (y >= 156 && y < 176 && x >= pathLeft && x < pathRight) return true;
  if (x >= 180 && x < 204 && y >= 174) return true;
  return PORTAL_X.some(cx => x >= cx - 14 && x < cx + 14 && y >= 148 && y < 158);
}

function buildBackground() {
  const c = makeCanvas(W, H);
  const b = c.getContext('2d');

  b.fillStyle = '#5fae4f';
  b.fillRect(0, 0, W, H);
  for (let i = 0; i < 900; i++) {
    b.fillStyle = rand() < 0.7 ? '#509c45' : '#78c465';
    b.fillRect(Math.floor(rand() * W), Math.floor(rand() * H), 1, rand() < 0.5 ? 2 : 1);
  }

  const [pathLeft, pathRight] = mainPathRange();
  const paths = [
    { x: pathLeft, y: 156, w: pathRight - pathLeft, h: 20 },
    { x: 180, y: 174, w: 24, h: 66 },

  ];

  b.fillStyle = '#dcbb83';
  paths.forEach(p => b.fillRect(p.x, p.y, p.w, p.h));
  for (let i = 0; i < 260; i++) {
    const x = Math.floor(rand() * W), y = Math.floor(rand() * H);

    b.fillStyle = rand() < 0.5 ? '#c9a46c' : '#ead1a0';
    b.fillRect(x, y, 2, 1);

  const flowerColors = ['#ff8fb8', '#ffe066', '#ffffff', '#9cc2ff'];
  for (let i = 0; i < 140; i++) {
    const x = 20 + Math.floor(rand() * 344), y = 112 + Math.floor(rand() * 112);

    if (PORTAL_X.some(cx => Math.abs(x - cx) < 22 && y < 160)) continue;
    b.fillStyle = flowerColors[Math.floor(rand() * flowerColors.length)];
    b.fillRect(x, y, 1, 1); b.fillRect(x + 2, y, 1, 1); b.fillRect(x + 1, y - 1, 1, 1); b.fillRect(x + 1, y + 1, 1, 1);
    b.fillStyle = '#ffcf3f';

    .forEach(([x, y]) => scenery.push({ kind: 'tree', x, y }));

function shade(hex, amount) {
  const n = parseInt(hex.slice(1), 16);
  const ch = s => Math.max(0, Math.min(255, ((n >> s) & 255) + amount));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}

    b.fillRect(rx - 1, sign.y + sign.h, 5, y - sign.y - sign.h);

  });
  b.fillStyle = '#1d1626';
  b.fillRect(sign.x - 1, sign.y - 1, sign.w + 2, sign.h + 2);
  b.fillStyle = '#ffd34d';
  b.fillRect(sign.x, sign.y, sign.w, sign.h);
  b.fillStyle = '#246bfe';
  b.fillRect(sign.x + 2, sign.y + 2, sign.w - 4, sign.h - 4);
  b.fillStyle = '#1d5ce5';

function inArch(px, py, halfWidth, bottom) {
  if (py > bottom) return false;
  const dx = px + 0.5 - 18;
  const dy = py + 0.5 - 18;
  if (dy < 0) return dx * dx + dy * dy <= halfWidth * halfWidth;
  return Math.abs(dx) <= halfWidth;
}

const SWIRL_CELLS = [];
for (let py = 0; py < 44; py++) {
  for (let px = 0; px < 36; px++) {
    if (!inArch(px, py, 13, 39)) continue;
    const dx = px + 0.5 - 18, dy = py + 0.5 - 22;
    SWIRL_CELLS.push({ px, py, r: Math.hypot(dx, dy * 0.8), a: Math.atan2(dy, dx) });
  }
}

function drawArch(b, cx, top, accent) {
  const x0 = cx - 18;
  const rand = mulberry32(cx);
  b.fillStyle = '#1d1626';
  b.fillRect(x0 - 4, top + 41, 44, 6);
  b.fillStyle = '#7c7f96';
  b.fillRect(x0 - 3, top + 42, 42, 4);
  b.fillStyle = '#a9adc4';
  b.fillRect(x0 - 3, top + 42, 42, 1);
  for (let py = 0; py < 44; py++) {
    for (let px = 0; px < 36; px++) {
      const outer = inArch(px, py, 18, 43);
      const inner = inArch(px, py, 13, 39);
      if (!outer || inner) continue;
      const edge = !inArch(px - 1, py, 18, 43) || !inArch(px + 1, py, 18, 43) || !inArch(px, py - 1, 18, 43)
        || inArch(px - 1, py, 13, 39) || inArch(px + 1, py, 13, 39) || inArch(px, py + 1, 13, 39) || inArch(px, py - 1, 13, 39);
      const mortar = py % 5 === 4 || (px + (Math.floor(py / 5) % 2) * 3) % 6 === 5;
      let color = px < 18 ? '#a7aac0' : '#8d90a8';
      if (mortar) color = '#6c6f86';
      else if (rand() < 0.12) color = '#b9bcd0';
      b.fillStyle = edge ? '#1d1626' : color;
      b.fillRect(x0 + px, top + py, 1, 1);
    }
  }
  b.fillStyle = '#1d1626';
  b.fillRect(cx - 3, top, 6, 5);
  b.fillStyle = accent;
  b.fillRect(cx - 2, top + 1, 4, 3);
  b.fillStyle = '#ffffff';
  b.fillRect(cx - 2, top + 1, 1, 1);
}

function downscale(img, width) {
  let source = img, w = img.naturalWidth, h = img.naturalHeight;
  while (w / 2 >= width) {
    w = Math.round(w / 2);
    h = Math.round(h / 2);
    const half = makeCanvas(w, h);
    const x = half.getContext('2d');
    x.imageSmoothingQuality = 'high';
    x.drawImage(source, 0, 0, w, h);
    source = half;
  }
  const out = makeCanvas(width, Math.round(h * width / w));
  const x = out.getContext('2d');
  x.imageSmoothingQuality = 'high';
  x.drawImage(source, 0, 0, out.width, out.height);
  return out;
}

function pickCatTarget() {
  const [x0, x1, y0, y1] = CAT_AREAS[Math.floor(Math.random() * CAT_AREAS.length)];
  cat.tx = x0 + Math.random() * (x1 - x0);
  cat.ty = y0 + Math.random() * (y1 - y0);

function updateEasterEggs(dt) {
  cat.timer -= dt;
  if (cat.mode === 'walk') {
    const dx = cat.tx - cat.x, dy = cat.ty - cat.y, dist = Math.hypot(dx, dy);
    if (dist < 1) {
      cat.mode = Math.random() < 0.35 ? 'sleep' : 'sit';
      cat.timer = cat.mode === 'sleep' ? 6 + Math.random() * 4 : 2 + Math.random() * 3;
    } else {
      cat.x += dx / dist * 16 * dt;
      cat.y += dy / dist * 16 * dt;
      cat.dir = dx >= 0 ? 1 : -1;
      cat.step += dt;
    }
  } else if (cat.timer <= 0) pickCatTarget();
  if (cat.mode === 'sleep' && Math.floor(time) % 3 === 0 && !speech.some(b => b.cat)) speech.push({ text: 'zZ', x: cat.x, y: cat.y - 12, until: time + 1, cat: true });

  shakeTrees.forEach(tree => {
    tree.shake = Math.max(0, tree.shake - dt * 3);
    tree.cooldown -= dt;
  });
  for (let i = apples.length - 1; i >= 0; i--) {
    const a = apples[i];
    if (a.z > 0 || a.vz > 0) {
      a.vz -= 220 * dt;
      a.z = Math.max(0, a.z + a.vz * dt);
      if (a.z === 0 && a.vz < 0) a.vz = Math.abs(a.vz) > 40 ? -a.vz * 0.35 : 0;
    } else if (state === 'play' && Math.hypot(hero.x - a.x, hero.y - a.ground) < 9) {
      apples.splice(i, 1);
      appleCount += 1;
      findEgg('apple');
      document.getElementById('apple-count').textContent = `사과 ${appleCount}`;
      document.getElementById('hud-apples').hidden = false;
      say('사과 +1', hero.x, hero.y - 22, 1);
      sfx('yes');
    }
  }

  if (time < fireworks.until) {
    fireworks.spawn -= dt;
    if (fireworks.spawn <= 0) {
      fireworks.spawn = 0.35;
      const cx = BILLBOARD.x + 10 + Math.random() * (BILLBOARD.w - 20), cy = 14 + Math.random() * 40;
      const color = ['#ffd34d', '#ff7ab6', '#4cc8ff', '#7bf18a', '#ffffff'][Math.floor(Math.random() * 5)];
      for (let i = 0; i < 36; i++) {
        const angle = i / 36 * Math.PI * 2, speed = 24 + Math.random() * 18;
        fireworks.sparks.push({ x: cx, y: cy, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1.3, color });
      }
      fireworks.flashes.push({ x: cx, y: cy, life: 0.25 });
      sfx('boom');
    }
  }
  fireworks.sparks.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 30 * dt; p.life -= dt * 0.9; });
  fireworks.sparks = fireworks.sparks.filter(p => p.life > 0);
  fireworks.flashes.forEach(f => { f.life -= dt; });
  fireworks.flashes = fireworks.flashes.filter(f => f.life > 0);
  for (let i = speech.length - 1; i >= 0; i--) if (time > speech[i].until) speech.splice(i, 1);
}

const toScreen = (x, y) => [ox + x * scale, oy + y * scale];

const billboardImages = CONFIG.billboard.images.map(loadImage);
const backdropCache = new WeakMap();

function loadImage(src) {
  const img = new Image();
  img.src = src;
  return img;
}

const isLoaded = img => img.complete && img.naturalWidth > 0;

function currentBillboardIndex() {
  const ready = billboardImages.filter(isLoaded);
  return ready.length ? Math.floor(time / CONFIG.billboard.interval) % ready.length : -1;
}

function blurredBackdrop(img) {
  if (!backdropCache.has(img)) {
    const c = makeCanvas(24, 14);
    const x = c.getContext('2d');
    const k = Math.max(24 / img.naturalWidth, 14 / img.naturalHeight);
    x.drawImage(img, (24 - img.naturalWidth * k) / 2, (14 - img.naturalHeight * k) / 2, img.naturalWidth * k, img.naturalHeight * k);
    backdropCache.set(img, c);
  }
  return backdropCache.get(img);
}

function drawFitted(img, sx, sy, sw, sh) {
  const iw = img.naturalWidth, ih = img.naturalHeight;
  ctx.imageSmoothingEnabled = true;
  if (ih / iw > (sh / sw) * 1.15) {
    ctx.drawImage(blurredBackdrop(img), sx, sy, sw, sh);
    ctx.fillStyle = 'rgba(7, 9, 15, 0.45)';
    ctx.fillRect(sx, sy, sw, sh);
    const k = sh / ih;
    ctx.drawImage(img, sx + (sw - iw * k) / 2, sy, iw * k, sh);
    return;
  }
  const k = Math.max(sw / iw, sh / ih);
  ctx.drawImage(img, sx + (sw - iw * k) / 2, sy + (sh - ih * k) / 2, iw * k, ih * k);
}

function drawBillboardFallback(sx, sy, sw, sh) {
  const size = Math.round(sh * 0.3);
  ctx.font = `${size}px Galmuri11, sans-serif`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  const text = CONFIG.billboard.fallbackText;
  const travel = ctx.measureText(text).width + sw;
  const offset = (time * sw * 0.32) % travel;
  ctx.fillStyle = '#ffd34d';
  ctx.shadowColor = 'rgba(255, 190, 60, 0.75)';
  ctx.shadowBlur = size * 0.35;
  ctx.fillText(text, sx + sw - offset, sy + sh / 2);
  ctx.shadowBlur = 0;
}

function drawBillboardScreen() {
  const { inner } = BILLBOARD;
  const [sx, sy] = toScreen(inner.x, inner.y);
  const sw = inner.w * scale, sh = inner.h * scale;
  ctx.save();
  ctx.beginPath();
  ctx.rect(sx, sy, sw, sh);
  ctx.clip();
  try {
    paintBillboard(sx, sy, sw, sh);
  } finally {
    ctx.restore();
  }
}

function paintBillboard(sx, sy, sw, sh) {
  ctx.fillStyle = '#07090f';
  ctx.fillRect(sx, sy, sw, sh);

  const ready = billboardImages.filter(isLoaded);
  if (ready.length === 0) {
    drawBillboardFallback(sx, sy, sw, sh);
  } else {
    const interval = CONFIG.billboard.interval;
    const slot = Math.floor(time / interval);
    const current = ready[slot % ready.length];
    const previous = ready[(slot + ready.length - 1) % ready.length];
    const wipe = Math.min((time % interval) / 0.6, 1);
    if (ready.length > 1 && slot > 0 && wipe < 1) {
      drawFitted(previous, sx, sy, sw, sh);
      ctx.save();
      ctx.beginPath();
      ctx.rect(sx, sy, sw, sh * Math.ceil(wipe * 8) / 8);
      ctx.clip();
      drawFitted(current, sx, sy, sw, sh);
      ctx.restore();
    } else {
      drawFitted(current, sx, sy, sw, sh);
    }
    if (ready.length > 1) {
      const dot = Math.max(3, Math.round(scale * 1.6));
      const startX = sx + sw / 2 - (ready.length * dot * 2.2) / 2;
      ready.forEach((_, i) => {
        ctx.fillStyle = i === slot % ready.length ? '#ffe27a' : 'rgba(255, 255, 255, 0.35)';
        ctx.fillRect(Math.round(startX + i * dot * 2.2), Math.round(sy + sh - dot * 2.2), dot, dot);
      });
    }
  }

  if (CONFIG.billboard.ledEffect && ledPattern) {
    ctx.fillStyle = ledPattern;
    ctx.fillRect(sx, sy, sw, sh);
  }
  const gloss = ctx.createLinearGradient(0, sy, 0, sy + sh);
  gloss.addColorStop(0, 'rgba(255, 255, 255, 0.10)');
  gloss.addColorStop(0.45, 'rgba(255, 255, 255, 0)');
  ctx.fillStyle = gloss;
  ctx.fillRect(sx, sy, sw, sh);
}

function nearPortal() {

function drawLabels() {

    const border = Math.max(2, Math.round(scale * 0.6));
    ctx.fillStyle = '#1d1626';
    ctx.fillRect(bx - border, by - border, tw + padX * 2 + border * 2, h + border * 2);
    ctx.fillStyle = highlighted ? p.accent : 'rgba(29, 22, 38, 0.92)';
    ctx.fillRect(bx, by, tw + padX * 2, h);
    ctx.fillStyle = highlighted ? '#1d1626' : '#ffffff';
    ctx.fillText(text, cx, by + h / 2 + 1);
  });

  const [sx, sy] = toScreen(150, 194);

  ctx.textBaseline = 'middle';
  ctx.font = `700 ${Math.round(scale * 4.2)}px Galmuri11, sans-serif`;

function drawLinkBubble() {

function drawBillboardHint() {

const EXIT_PATH = { left: 184, right: 200 };

function blocked(x, y) {
  const onExitPath = x >= EXIT_PATH.left && x <= EXIT_PATH.right && y > BOUNDS.bottom;
  if (onExitPath) return false;
  if (x < BOUNDS.left || x > BOUNDS.right || y < BOUNDS.top || y > BOUNDS.bottom) return true;
  const fx = x - 5, fy = y - 3;
  return SOLIDS.some(s => fx < s.x + s.w && fx + 10 > s.x && fy < s.y + s.h && fy + 3 > s.y);
}

function portalUnderHero() {
  return portals.find(p => Math.abs(hero.x - p.cx) <= 9 && hero.y <= 152);
}

function updatePlay(dt) {
  let dx = 0, dy = 0;
  if (keys.has('left')) dx -= 1;
  if (keys.has('right')) dx += 1;
  if (keys.has('up')) dy -= 1;
  if (keys.has('down')) dy += 1;
  hero.moving = dx !== 0 || dy !== 0;
  if (!hero.moving) { hero.animT = 0; return; }

  const tapped = tappedKeys.size > 0;
  tappedKeys.clear();
  releasedKeys.forEach(direction => keys.delete(direction));
  releasedKeys.clear();
  const step = Math.max(SPEED * dt, tapped ? 4 : 0) / Math.hypot(dx, dy);
  if (!blocked(hero.x + dx * step, hero.y)) hero.x += dx * step;
  if (!blocked(hero.x, hero.y + dy * step)) hero.y += dy * step;
  hero.dir = dx < 0 ? 'left' : dx > 0 ? 'right' : dy < 0 ? 'up' : 'down';
  hero.animT += dt;

  if (hero.y > H + 6) {
    leaveVillage();
    return;
  }

  const goldDistance = Math.hypot(hero.x - LINK_SIGN.x, hero.y - LINK_SIGN.y);
  if (goldDistance > 26) goldArmed = true;
  if (goldDistance < 15 && goldArmed) {
    goldArmed = false;
    openConfirm();
    return;
  }

  const portal = portalUnderHero();
  if (portal) startWarp(portal);
}

function startWarp(portal) {
  state = 'warp';
  keys.clear();
  tappedKeys.clear();
  releasedKeys.clear();
  hero.moving = false;
  hero.warp = { portal, t: 0, sx: hero.x, sy: hero.y, done: false };
  sfx('warp');
}

function updateWarp(dt) {
  const w = hero.warp;
  w.t += dt;
  const k = Math.min(w.t / 0.7, 1);
  const ease = 1 - (1 - k) ** 3;
  hero.x = w.sx + (w.portal.cx - w.sx) * ease;
  hero.y = w.sy + (PORTAL_TOP + 30 - w.sy) * ease;
  hero.scale = 1 - 0.85 * ease;
  hero.dir = SPIN[Math.floor(w.t / 0.07) % SPIN.length];
  if (k >= 1 && !w.done) {
    w.done = true;
    fadeThrough(() => openDeck(w.portal));
  }
}

function updateIntro(dt) {
  hero.moving = true;
  hero.dir = 'up';
  hero.animT += dt;
  hero.y = Math.max(SPAWN.y, hero.y - SPEED * 0.7 * dt);
  if (hero.y === SPAWN.y) { hero.moving = false; state = 'play'; }
}

let pendingFade = null;

function fadeThrough(midway) {
  state = 'transition';
  fadeEl.classList.add('on');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  pendingFade = { at: time + (reduce ? 0 : 0.34), midway };
}

function updateFade() {
  if (!pendingFade || time < pendingFade.at) return;
  const { midway } = pendingFade;
  pendingFade = null;
  midway();
  fadeEl.classList.remove('on');
}

function leaveVillage() {
  keys.clear();
  hero.moving = false;
  setBgm(false);
  sfx('close');
  fadeThrough(() => {
    hudEl.hidden = true;
    hero.visible = false;
    hero.x = SPAWN.x;
    hero.y = SPAWN.y;
    titleEl.hidden = false;
    state = 'title';
  });
}

let entering = false;

async function enterVillage(index = selectedChannel) {
  if (state !== 'title' || entering) return;
  entering = true;
  unlockAudio();
  sfx('start');
  const next = CONFIG.channels[index];
  await loadChannel(next);
  setChannel(next);
  entering = false;
  setBgm(true);
  fadeThrough(() => {
    titleEl.hidden = true;
    hudEl.hidden = false;
    hero.visible = true;
    hero.x = SPAWN.x;
    hero.y = H + 10;
    state = 'intro';
    setTimeout(() => { if (state === 'play') say('Space를 눌러봐요!', hero.x, hero.y - 26, 2.4); }, 2200);
  });
}

let deck = null;
let sceneAnimations = [];
let arena = null;

function chatMarkup(s) {
  const messages = s.messages.map(m => {
    const name = m.name ? `<span class="chat-name">${escapeHtml(m.name)}</span>` : '';
    const link = m.link ? `<br><span class="chat-link">${escapeHtml(m.link)}</span>` : '';
    return `<div class="chat-msg chat-msg--${m.from}" data-stage="${m.stage}">${name}<p class="chat-text">${rich(m.text)}${link}</p></div>`;
  }).join('');
  const notes = s.stages.map((stage, i) => `<li data-stage="${i}">${rich(stage.note)}</li>`).join('');
  const popup = s.popup
    ? `<figure class="chat-popup" data-stage="${s.popup.stage}"><img src="${escapeHtml(s.popup.image)}" alt="${escapeHtml(s.popup.caption)}"><figcaption>${escapeHtml(s.popup.caption)}</figcaption></figure>`
    : '';
  return `${headingMarkup(s)}<div class="chat-scene"><div class="chat-phone"><header class="chat-head"><span class="chat-room">${escapeHtml(s.room)}</span><span class="chat-members" data-members></span></header><div class="chat-body">${messages}</div>${popup}</div><ol class="chat-notes">${notes}</ol></div>`;
}

function arenaMarkup(s) {
  const meter = (label, key) => `<div class="arena-meter"><span>${label}</span><b data-arena="${key}"></b></div>`;
  const steps = s.stages.map(() => '<i></i>').join('');
  return `${headingMarkup(s)}<div class="arena"><canvas class="arena-canvas"></canvas><div class="arena-hud">${meter('목표', 'rps')}${meter('p95', 'p95')}${meter('오류율', 'err')}</div><div class="arena-steps">${steps}</div><p class="arena-note" data-arena="note"></p></div>`;
}

function staminaMarkup(s) {
  const meter = (label, key) => `<div class="arena-meter"><span>${label}</span><b data-stamina="${key}"></b></div>`;
  const steps = s.stages.map(() => '<i></i>').join('');
  return `${headingMarkup(s)}<div class="stamina"><canvas class="stamina-canvas"></canvas><div class="stamina-hud">${meter('속도', 'speed')}${meter('심박', 'bpm')}${meter('체력', 'hp')}</div><div class="arena-steps">${steps}</div><p class="arena-note" data-stamina="note"></p></div>`;
}

function sensorsMarkup(s) {
  const pads = s.sensors.map(sensor => `<span class="sensor-pad" data-stage="${sensor.stage}" style="--c: ${sensor.color}; left: ${sensor.x}%; top: ${sensor.y}%"></span>`).join('');
  const rows = s.sensors.map(sensor => `<li class="sensor-row" data-stage="${sensor.stage}" style="--c: ${sensor.color}"><i></i><span>${escapeHtml(sensor.body)}</span><em>=</em><b>${rich(sensor.metric)}</b></li>`).join('');
  return `${headingMarkup(s)}<div class="sensor-scene"><div class="sensor-body"><div class="sensor-face"><i></i><i></i></div>${pads}</div><ul class="sensor-list"><li class="sensor-note" data-note></li>${rows}</ul></div>`;
}

let stamina = null;

function setupStamina() {
  const canvas = frameEl.querySelector('.stamina-canvas');
  stamina = { canvas, ctx: canvas.getContext('2d'), belt: 0, phase: 0, ecg: [], ecgAcc: 0 };
}

const STAMINA_SPEED = { rest: 0.8, jog: 2.2, run: 4.2, dead: 0 };

function updateStamina(dt) {
  if (!stamina || !stamina.canvas.isConnected) { stamina = null; return; }
  const stage = deck.slides[deck.index].stages[deck.stage];
  const speed = STAMINA_SPEED[stage.mode];
  stamina.belt = (stamina.belt + speed * 14 * dt) % 6;
  stamina.phase += speed * 3 * dt;
  const bpm = typeof stage.bpm === 'number' ? stage.bpm : 180;
  stamina.ecgAcc += dt * 60;
  while (stamina.ecgAcc >= 1) {
    stamina.ecgAcc -= 1;
    stamina.beat = (stamina.beat || 0) + bpm / 60 / 60;
    const f = stamina.beat % 1;
    const v = stage.mode === 'dead' ? 0 : f < 0.06 ? -f * 120 : f < 0.1 ? (f - 0.06) * 360 - 7 : f < 0.14 ? 7 - (f - 0.1) * 200 : 0;
    stamina.ecg.push(v);
    if (stamina.ecg.length > 120) stamina.ecg.shift();
  }
  drawStamina(stage);
}

function drawStamina(stage) {
  const { canvas, ctx: c } = stamina;
  const dpr = window.devicePixelRatio || 1;
  const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  const k = Math.min(w / ARENA_W, h / ARENA_H);
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = '#f2f6ff';
  c.fillRect(0, 0, w, h);
  c.setTransform(k, 0, 0, k, (w - ARENA_W * k) / 2, h - ARENA_H * k);
  c.imageSmoothingEnabled = false;
  c.fillStyle = '#dfe6f5';
  c.fillRect(-40, 86, ARENA_W + 80, 14);

  const px = (x, y, ww, hh, color) => { c.fillStyle = color; c.fillRect(x, y, ww, hh); };
  px(38, 78, 104, 9, '#1d1626');
  px(39, 79, 102, 6, '#4a4f6b');
  for (let x = 39 - stamina.belt; x < 141; x += 6) px(Math.max(39, x), 80, 2, 4, '#2d3352');
  px(132, 46, 3, 33, '#1d1626');
  px(120, 44, 18, 4, '#1d1626');
  px(121, 45, 16, 2, stage.mode === 'run' ? '#ff4d4d' : '#7bf18a');

  const mode = stage.mode;
  if (mode === 'dead') {
    drawFallenServer(px);
    drawStaminaMonitor(px, c, mode);
    return;
  }
  const fast = mode === 'run' ? 1 : 0;
  const bob = mode === 'rest' ? 0 : Math.round(Math.sin(stamina.phase * 2) * (1 + fast));
  const bx = 80, by = 40 + bob;
  const stride = Math.sin(stamina.phase * 2) > 0;
  px(bx + 6, by + 34, 3, 5 - (mode !== 'rest' && stride ? 2 : 0), '#1d1626');
  px(bx + 15, by + 34, 3, 5 - (mode !== 'rest' && !stride ? 2 : 0), '#1d1626');
  px(bx - 1, by - 1, 26, 36, '#1d1626');
  px(bx, by, 24, 34, '#2d3352');
  for (let row = 0; row < 3; row++) {
    px(bx + 3, by + 14 + row * 6, 18, 3, '#434b73');
    const blink = Math.floor(time * (mode === 'run' ? 14 : mode === 'jog' ? 6 : 2) + row) % 2 === 0;
    px(bx + 18, by + 15 + row * 6, 2, 1, blink ? (mode === 'run' ? '#ff4d4d' : '#7bf18a') : '#2f6b3a');
  }
  px(bx + 5, by + 4, 4, 4, '#ffffff');
  px(bx + 15, by + 4, 4, 4, '#ffffff');
  px(bx + 7, by + 6, 2, 2, '#1d1626');
  px(bx + 17, by + 6, 2, 2, '#1d1626');
  if (mode === 'run') {
    px(bx + 4, by + 3, 5, 1, '#1d1626');
    px(bx + 15, by + 3, 5, 1, '#1d1626');
    px(bx + 3, by + 9, 3, 2, '#ff9aa2');
    px(bx + 18, by + 9, 3, 2, '#ff9aa2');
    px(bx + 9, by + 10, 6, 2, '#1d1626');
    if (Math.floor(time * 3) % 2 === 0) { px(bx - 4, by + 2, 2, 3, '#4cc8ff'); px(bx + 27, by + 6, 2, 3, '#4cc8ff'); }
  } else {
    px(bx + 9, by + 10, 6, 1, '#1d1626');
  }
  const arm = mode === 'rest' ? 0 : (stride ? -3 : 3);
  px(bx - 4, by + 15 + arm, 4, 2, '#1d1626');
  px(bx + 24, by + 15 - arm, 4, 2, '#1d1626');

  drawStaminaMonitor(px, c, mode);
}

function drawFallenServer(px) {
  const bx = 62, by = 64;
  px(bx - 1, by - 1, 36, 16, '#1d1626');
  px(bx, by, 34, 14, '#2d3352');
  for (let col = 0; col < 3; col++) px(bx + 12 + col * 7, by + 3, 4, 8, '#434b73');
  const eye = (x, y) => { px(x, y, 1, 1, '#fff'); px(x + 2, y, 1, 1, '#fff'); px(x + 1, y + 1, 1, 1, '#fff'); px(x, y + 2, 1, 1, '#fff'); px(x + 2, y + 2, 1, 1, '#fff'); };
  eye(bx + 3, by + 2);
  eye(bx + 3, by + 8);
  const rise = (time * 6) % 26;
  const sway = Math.round(Math.sin(time * 3) * 2);
  const gx = bx + 8 + sway, gy = by - 10 - rise;
  px(gx, gy, 7, 6, 'rgba(255, 255, 255, 0.85)');
  px(gx + 1, gy + 6, 1, 2, 'rgba(255, 255, 255, 0.85)');
  px(gx + 3, gy + 6, 1, 1, 'rgba(255, 255, 255, 0.85)');
  px(gx + 5, gy + 6, 1, 2, 'rgba(255, 255, 255, 0.85)');
  px(gx + 2, gy + 2, 1, 1, '#1d1626');
  px(gx + 4, gy + 2, 1, 1, '#1d1626');
  px(bx + 6, by - 4, 8, 1, '#ffd34d');
}

function drawStaminaMonitor(px, c, mode) {
  px(168, 18, 66, 46, '#1d1626');
  px(170, 20, 62, 42, mode === 'dead' && Math.floor(time * 2) % 2 === 0 ? '#3a0d12' : '#0d2b2b');
  c.strokeStyle = mode === 'run' || mode === 'dead' ? '#ff6b6b' : '#7bf18a';
  c.lineWidth = 1;
  c.beginPath();
  stamina.ecg.forEach((v, i) => {
    const x = 171 + i / 2, y = 41 + v * 1.6;
    if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
  });
  c.stroke();
  px(176, 66, 50, 18, '#1d1626');
  px(177, 67, 48, 16, '#2d3352');
}

function renderStage(withSound) {
  const slide = deck.slides[deck.index];
  const stage = slide.stages[deck.stage];
  if (slide.type === 'sequence') {
    if (['profile-link', 'review-demo', 'followup'].includes(slide.layout)) {
      renderSalonStage(slide, stage);
    } else if (slide.layout === 'handoff') {
      const scene = frameEl.querySelector('.handoff');
      const servingServers = Array.isArray(stage.serving) ? stage.serving : [stage.serving];
      const servingLabel = stage.servingLabel ?? slide.servingLabel;
      scene.classList.toggle('is-animated', withSound);
      scene.classList.toggle('is-switching', withSound && servingServers.length === 1 && servingServers[0] === 0);
      scene.querySelectorAll('[data-handoff-server]').forEach((server, i) => {
        const serving = servingServers.includes(i);
        const serverState = stage.serverStates?.[i];
        const status = serverState?.status ?? (serving ? servingLabel : slide.deployingLabel);
        const detail = serverState?.detail ?? (serving ? stage.servingDetail : slide.excludedLabel);
        server.classList.toggle('is-serving', serving);
        server.dataset.phase = serverState?.phase ?? '';
        server.setAttribute('aria-label', `${slide.servers[i]}: ${status}, ${detail}`);
        const statusGroup = server.querySelector(serving ? '.server-status--serving' : '.server-status--deploying');
        statusGroup.querySelector('[data-handoff-status]').textContent = status;
        statusGroup.querySelector('[data-handoff-version]').textContent = detail;
      });
      scene.querySelectorAll('[data-handoff-path]').forEach((path, i) => path.classList.toggle('is-serving', servingServers.includes(i)));
    } else if (slide.layout === 'schema') {
      const scene = frameEl.querySelector('.schema');
      scene.classList.toggle('is-animated', withSound);
      scene.classList.toggle('is-missing', !stage.columns);
      for (const mode of ['unused', 'checking', 'failed']) scene.classList.toggle(`is-${mode}`, stage.mode === mode);
      scene.querySelectorAll('[data-schema-code]').forEach((code, i) => {
        code.classList.toggle('is-current', i === deck.stage);
        code.setAttribute('aria-hidden', String(i !== deck.stage));
      });
      scene.querySelector('[data-schema-code-group]').setAttribute('aria-label', `${stage.code}: ${stage.codeDetail}, ${stage.codeStatus}`);
      scene.querySelector('[data-schema-db]').setAttribute('aria-label', `${slide.database}: ${stage.dbDetail}`);
      scene.querySelector('[data-schema-db-detail]').textContent = stage.dbDetail;
      scene.querySelector('[data-schema-connection]').textContent = stage.connection;
    } else frameEl.querySelectorAll('.sequence-panel').forEach((panel, i) => {
      const pending = i > deck.stage;
      panel.classList.toggle('is-pending', pending);
      panel.classList.toggle('is-entering', i === deck.stage);
      panel.querySelector('.sequence-visual').setAttribute('aria-hidden', String(pending));
      const img = panel.querySelector('img');
      // Load each animated image only when its step is revealed, never on a timer.
      if (pending) img.removeAttribute('src');
      else if (!img.hasAttribute('src')) img.src = slide.stages[i].image;
    });
    frameEl.querySelector('[data-sequence-note]').textContent = stage.note;
    frameEl.querySelector('[data-sequence-progress]').textContent = `${deck.stage + 1} / ${slide.stages.length} · ${deck.stage < slide.stages.length - 1 ? '다음을 눌러 이어보기' : '다음을 누르면 다음 페이지'}`;
    const sayText = frameEl.querySelector('.say-text');
    if (withSound && sayText) {
      const say = sayText.closest('.say');
      say.classList.remove('done');
      say.classList.add('talking');
      sayText.textContent = '';
      deck.typing = { el: sayText, text: stage.say ?? slide.say, start: time };
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) finishTyping();
    }
    if (withSound) sfx('next');
  }
  if (slide.type === 'sensors') {
    frameEl.querySelectorAll('.sensor-scene [data-stage]').forEach(el => el.classList.toggle('is-hidden', Number(el.dataset.stage) > deck.stage));
    frameEl.querySelector('[data-note]').innerHTML = rich(stage.note);
    if (withSound) sfx('open');
  }
  if (slide.type === 'stamina') {
    const box = frameEl.querySelector('.stamina');
    box.dataset.mode = stage.mode;
    box.dataset.unknown = String(stage.hp === '???');
    box.querySelector('[data-stamina="speed"]').textContent = stage.speed;
    box.querySelector('[data-stamina="bpm"]').textContent = typeof stage.bpm === 'number' ? `${stage.bpm}` : stage.bpm;
    box.querySelector('[data-stamina="hp"]').textContent = stage.hp;
    box.querySelector('[data-stamina="note"]').innerHTML = rich(stage.note);
    box.querySelectorAll('.arena-steps i').forEach((dot, i) => dot.classList.toggle('on', i <= deck.stage));
    if (withSound) sfx(stage.mode === 'dead' ? 'flatline' : 'next');
  }
  if (slide.type === 'chat') {
    frameEl.querySelectorAll('.chat-scene [data-stage]').forEach(el => {
      const at = Number(el.dataset.stage);
      el.classList.toggle('is-hidden', at > deck.stage);
      el.classList.toggle('is-current', at === deck.stage);
    });
    frameEl.querySelector('[data-members]').textContent = stage.members ? `참여 ${stage.members}` : '';
    if (withSound) sfx('tick');
  }
  if (slide.type === 'arena') {
    const box = frameEl.querySelector('.arena');
    box.dataset.mode = stage.mode;
    box.querySelector('[data-arena="rps"]').textContent = `${stage.rps} RPS`;
    box.querySelector('[data-arena="p95"]').textContent = stage.p95;
    box.querySelector('[data-arena="err"]').textContent = stage.err;
    box.querySelector('[data-arena="note"]').innerHTML = rich(stage.note);
    box.querySelectorAll('.arena-steps i').forEach((dot, i) => dot.classList.toggle('on', i <= deck.stage));
    if (arena) arena.stage = stage;
    if (withSound) sfx(stage.mode === 'down' ? 'close' : 'next');
  }
}

const ARENA_W = 240, ARENA_H = 100, ARENA_DOOR = 196;
const ARENA_COLORS = ['#246bfe', '#ff7ab6', '#ffb938', '#4cc8ff', '#7bc96f', '#b48cff'];

function setupArena(slide) {
  const canvas = frameEl.querySelector('.arena-canvas');
  arena = { canvas, ctx: canvas.getContext('2d'), people: [], queue: [], spawn: 0, serve: 0, stage: slide.stages[deck.stage], rand: mulberry32(11) };
}

function arenaRates(stage) {
  const spawn = Math.min(36, Math.max(1.2, stage.rps / 4));
  const serve = stage.mode === 'ok' ? Infinity : stage.mode === 'slow' ? spawn * 0.55 : spawn * 0.25;
  return { spawn, serve, patience: stage.mode === 'down' ? 2.2 : 7 };
}

function updateArena(dt) {
  if (!arena || !arena.canvas.isConnected) { arena = null; return; }
  const { people, queue, rand } = arena;
  const { spawn, serve, patience } = arenaRates(arena.stage);
  arena.spawn += spawn * dt;
  while (arena.spawn >= 1) {
    arena.spawn -= 1;
    people.push({ x: -4, y: 58 + rand() * 30, lane: rand(), color: ARENA_COLORS[Math.floor(rand() * ARENA_COLORS.length)], mode: 'walk', age: 0, fade: 1 });
  }
  if (serve === Infinity) queue.splice(0).forEach(p => { p.mode = 'enter'; });
  else {
    arena.serve += serve * dt;
    while (arena.serve >= 1 && queue.length) { arena.serve -= 1; queue.shift().mode = 'enter'; }
    if (!queue.length) arena.serve = Math.min(arena.serve, 1);
  }
  queue.forEach((p, i) => {
    p.age += dt;
    p.tx = ARENA_DOOR - 6 - Math.floor(i / 4) * 5;
    p.ty = 62 + (i % 4) * 7;
    if (p.age > patience || i > 90) p.mode = 'timeout';
  });
  for (let i = queue.length - 1; i >= 0; i--) if (queue[i].mode !== 'queue') queue.splice(i, 1);
  for (let i = people.length - 1; i >= 0; i--) {
    const p = people[i];
    if (p.mode === 'walk') {
      p.x += 55 * dt;
      p.y += (72 - p.y) * dt * 0.8;
      const stop = serve === Infinity ? ARENA_DOOR : ARENA_DOOR - 6 - Math.floor(queue.length / 4) * 5;
      if (p.x >= stop) {
        if (serve === Infinity) p.mode = 'enter';
        else { p.mode = 'queue'; p.age = 0; queue.push(p); }
      }
    } else if (p.mode === 'queue') {
      p.x += (p.tx - p.x) * Math.min(1, dt * 6);
      p.y += (p.ty - p.y) * Math.min(1, dt * 6);
    } else if (p.mode === 'enter') {
      p.x += 70 * dt;
      p.y += (72 - p.y) * dt * 4;
      if (p.x > ARENA_DOOR + 8) people.splice(i, 1);
    } else if (p.mode === 'timeout') {
      p.y -= 18 * dt;
      p.fade -= dt * 1.4;
      if (p.fade <= 0) people.splice(i, 1);
    }
  }
  drawArena();
}

function drawArenaFire(c) {
  const flame = (x, base, height, seed) => {
    const flicker = Math.floor(time * 10 + seed) % 3;
    const h = height - flicker;
    c.fillStyle = '#c62828';
    c.fillRect(x, base - h, 5, h);
    c.fillStyle = '#ff8a1f';
    c.fillRect(x + 1, base - h + 2, 3, h - 2);
    c.fillStyle = '#ffd34d';
    c.fillRect(x + 2, base - h + 4, 1, Math.max(1, h - 5));
  };
  [[ARENA_DOOR + 1, 9, 0], [ARENA_DOOR + 7, 13, 1.3], [ARENA_DOOR + 14, 8, 2.1], [ARENA_DOOR + 20, 12, 0.7], [ARENA_DOOR + 26, 9, 1.8]]
    .forEach(([x, h, seed]) => flame(x, 17, h, seed));
  flame(ARENA_DOOR - 3, 46, 7, 2.6);
  flame(ARENA_DOOR + 31, 38, 8, 0.4);
  for (let i = 0; i < 4; i++) {
    const rise = (time * 9 + i * 7) % 26;
    c.fillStyle = `rgba(90, 90, 100, ${0.45 - rise / 70})`;
    c.fillRect(ARENA_DOOR + 6 + i * 6 + Math.round(Math.sin(time * 2 + i) * 2), 2 - rise, 4, 3);
  }
}

function drawArena() {
  const { canvas, ctx: c, people } = arena;
  const dpr = window.devicePixelRatio || 1;
  const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  const k = Math.min(w / ARENA_W, h / ARENA_H);
  const offX = (w - ARENA_W * k) / 2, offY = h - ARENA_H * k;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = '#eaf4ff';
  c.fillRect(0, 0, w, h);
  c.setTransform(k, 0, 0, k, offX, offY);
  c.imageSmoothingEnabled = false;
  c.fillStyle = '#cfe3c4';
  c.fillRect(-40, 54, ARENA_W + 80, 46);
  c.fillStyle = '#dcbb83';
  c.fillRect(-40, 64, ARENA_W + 80, 22);

  const mode = arena.stage.mode;
  const flash = mode === 'down' && Math.floor(time * 4) % 2 === 0;
  c.fillStyle = '#1d1626';
  c.fillRect(ARENA_DOOR - 1, 16, 34, 72);
  c.fillStyle = flash ? '#7a1f2b' : '#2d3352';
  c.fillRect(ARENA_DOOR, 17, 32, 70);
  for (let row = 0; row < 6; row++) {
    c.fillStyle = '#434b73';
    c.fillRect(ARENA_DOOR + 3, 21 + row * 8, 26, 5);
    const on = mode === 'ok' ? (Math.floor(time * 3 + row) % 3 !== 0) : Math.floor(time * (mode === 'slow' ? 10 : 16) + row) % 2 === 0;
    c.fillStyle = mode === 'ok' ? (on ? '#7bf18a' : '#2f6b3a') : mode === 'slow' ? (on ? '#ffd34d' : '#7a6a3a') : (on ? '#ff4d4d' : '#5c1220');
    c.fillRect(ARENA_DOOR + 24, 22 + row * 8, 3, 3);
  }
  c.fillStyle = '#1d1626';
  c.fillRect(ARENA_DOOR + 10, 74, 12, 14);
  c.fillStyle = mode === 'down' ? '#c62828' : '#ffe9a0';
  c.fillRect(ARENA_DOOR + 11, 75, 10, 13);
  if (mode === 'down') drawArenaFire(c);
  if (mode === 'slow' && Math.floor(time * 2) % 2 === 0) {
    c.fillStyle = '#4cc8ff';
    c.fillRect(ARENA_DOOR - 4, 20, 2, 3);
    c.fillRect(ARENA_DOOR + 35, 26, 2, 3);
  }

  people.slice().sort((a, b) => a.y - b.y).forEach(p => {
    const x = Math.round(p.x), y = Math.round(p.y);
    c.globalAlpha = Math.max(0, p.fade);
    const step = p.mode === 'walk' || p.mode === 'enter' ? Math.floor(time * 8 + p.lane * 10) % 2 : 0;
    c.fillStyle = '#1d1626';
    c.fillRect(x - 1, y - 9, 5, 10);
    c.fillStyle = '#ffd5b0';
    c.fillRect(x, y - 8, 3, 3);
    c.fillStyle = p.mode === 'timeout' ? '#ff4d4d' : p.color;
    c.fillRect(x, y - 5, 3, 3);
    c.fillStyle = '#2b3557';
    c.fillRect(x + (step ? 0 : 2), y - 2, 1, 2);
    c.fillRect(x + (step ? 2 : 0), y - 2, 1, 1);
    if (p.mode === 'timeout') {
      c.fillStyle = '#c62828';
      c.fillRect(x, y - 14, 1, 1); c.fillRect(x + 2, y - 14, 1, 1); c.fillRect(x + 1, y - 13, 1, 1); c.fillRect(x, y - 12, 1, 1); c.fillRect(x + 2, y - 12, 1, 1);
    }
  });
  c.globalAlpha = 1;
}


function openDeck(portal) {
  deck = { portal, index: 0, slides: [{ type: 'toc', say: portal.tocSay }, ...portal.slides], typing: null };
  hudEl.hidden = true;
  deckEl.hidden = false;
  deckEl.style.setProperty('--accent', portal.accent);
  deckEl.style.setProperty('--accent-deep', portal.accentDeep);
  deckEl.style.setProperty('--accent-soft', portal.accentSoft);
  document.getElementById('deck-label').textContent = portal.label;
  state = 'deck';
  setBgm(false);
  renderSlide('next');
}

function closeDeck() {
  if (state !== 'deck') return;
  cancelSceneMotion();
  const portal = deck.portal;
  sfx('close');
  fadeThrough(() => {
    setBgm(true);
    deckEl.hidden = true;
    hudEl.hidden = false;
    visited.add(portal.id);
    hero.warp = null;
    hero.scale = 1;
    hero.x = portal.cx;
    hero.y = RETURN_Y;
    hero.dir = 'down';
    keys.clear();
    deck = null;
    state = 'play';
  });
}

function moveSlide(delta) {
  if (state !== 'deck') return;
  const slide = deck.slides[deck.index];
  if (slide.stages) {
    const step = deck.stage + delta;
    if (step >= 0 && step < slide.stages.length) {
      deck.stage = step;
      renderStage(true);
      return;
    }
  }
  if (slide.scene === 'goals') {
    const step = deck.castStep + delta;
    if (step >= 0 && step < slide.turns.length) {
      cancelSceneMotion();
      deck.castStep = step;
      renderGoalState(delta > 0 ? step : null);
      return;
    }
  }
  if (slide.scene === 'request') {
    const step = deck.requestStep + delta;
    if (step >= 0 && step < slide.turns.length) {
      const movingSpeakers = [...frameEl.querySelectorAll('.scene-actor.is-walking')].map(actor => actor.dataset.speaker);
      cancelSceneMotion();
      deck.requestStep = step;
      renderRequestState(true, movingSpeakers);
      return;
    }
  }
  if (slide.type === 'dialogue') {
    const step = deck.dialogueStep + delta;
    if (step >= 0 && step <= slide.turns.length) {
      deck.dialogueStep = step;
      renderDialogueState();
      return;
    }
  }
  const next = deck.index + delta;
  if (next >= deck.slides.length) return closeDeck();
  if (next < 0) return;
  goToSlide(next, delta > 0 ? 'next' : 'prev');
}

function goToSlide(index, direction) {
  sfx(direction);
  deck.index = index;
  renderSlide(direction);
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
}

const rich = text => escapeHtml(text).replace(/\*\*(.+?)\*\*/g, '<mark>$1</mark>').replace(/\n/g, '<br>');

function actSlides() {
  return deck.slides.map((s, index) => ({ s, index })).filter(({ s }) => s.type === 'act');
}

function currentAct() {
  for (let i = deck.index; i >= 0; i--) {
    if (deck.slides[i].type === 'act') return deck.slides[i];
  }
  return null;
}

function headingMarkup(s) {
  return [
    s.kicker ? `<p class="slide-kicker">${escapeHtml(s.kicker)}</p>` : '',
    s.title ? `<h2 class="slide-title">${rich(s.title)}</h2>` : '',
    s.subtitle ? `<p class="slide-subtitle">${rich(s.subtitle)}</p>` : '',

}

function mediaMarkup(s) {
  if (s.images) {
    const cards = s.images.map((src, i) => `<figure class="stack-card"><img src="${escapeHtml(src)}" alt="${escapeHtml(`${s.title ?? ''} ${i + 1}`)}"></figure>`).join('');
    const hint = s.images.length > 1 ? `<p class="stack-hint">사진을 누르면 넘어가요 <span data-stack-count></span></p>` : '';
    return `<div class="stack" data-stack>${cards}${hint}</div>`;

    const caption = s.caption ? `<figcaption>${escapeHtml(s.caption)}</figcaption>` : '';
    return `<figure class="slide-media"><img src="${escapeHtml(s.image)}" alt="${escapeHtml(s.caption ?? s.title ?? '')}">${caption}</figure>`;
  }
  return '';
}

function renderSalonStage(slide, stage) {
  const scene = frameEl.querySelector('.salon-scene');
  if (scene) {
    scene.dataset.mode = stage.mode;
    scene.setAttribute('aria-label', `${stage.label}: ${stage.note}`);
  }
  frameEl.querySelectorAll('[data-salon-step]').forEach(el => {
    const i = Number(el.dataset.salonStep);
    el.classList.toggle('is-done', i <= deck.stage);
    el.classList.toggle('is-current', i === deck.stage);
    if (i === deck.stage) el.setAttribute('aria-current', 'step');
    else el.removeAttribute('aria-current');
  });
  if (slide.layout === 'profile-link') {
    const view = stage.mode === 'updated' ? 'profile' : stage.mode;
    frameEl.querySelectorAll('[data-phone-view]').forEach(el => {
      const current = el.dataset.phoneView === view;
      el.classList.toggle('is-current', current);
      el.setAttribute('aria-hidden', String(!current));
    });
    frameEl.querySelector('[data-profile-title]').textContent = stage.mode === 'updated' ? slide.labels.updated : slide.labels.profile;
  }
  if (slide.layout === 'review-demo') {
    frameEl.querySelector('[data-review-label]').textContent = stage.screenLabel;
    frameEl.querySelector('[data-review-detail]').textContent = stage.screenDetail;
    frameEl.querySelector('.review-crop img').setAttribute('aria-hidden', String(stage.mode === 'upload'));
  }
  if (slide.layout === 'followup') {
    frameEl.querySelectorAll('[data-followup-stage]').forEach(el => {
      const i = Number(el.dataset.followupStage);
      el.classList.toggle('is-current', i === deck.stage);
      el.classList.toggle('is-pending', i > deck.stage);
      el.querySelector('span').setAttribute('aria-hidden', String(i > deck.stage));
    });
  }
}

  } else {
    const headers = '<span></span>' + s.stages.map((stage, i) => `<h3 class="followup-head" data-salon-step="${i}">${escapeHtml(stage.label)}</h3>`).join('');
    const rows = s.tracks.map((track, row) => `<strong class="followup-track">${escapeHtml(track)}</strong>${s.stages.map((stage, i) => `<div class="followup-cell" data-followup-stage="${i}"><span>${rich(stage.cells[row])}</span></div>`).join('')}`).join('');
    scene = `<div class="followup-grid" role="group" aria-label="대상과 시점별 확인 계획">${headers}${rows}</div>`;
  }
  return `${headingMarkup(s)}${s.layout === 'followup' ? '' : steps}${scene}${controls}`;
}

function slideMarkup(s) {
  if (s.type === 'sequence') {
    if (['profile-link', 'review-demo', 'followup'].includes(s.layout)) return { kind: 'salon', body: salonMarkup(s) };
    if (s.layout === 'handoff') return { kind: 'handoff', body: handoffMarkup(s) };
    if (s.layout === 'schema') return { kind: 'schema', body: schemaMarkup(s) };
    const panels = s.stages.map((stage, i) => `<figure class="sequence-panel is-pending"><figcaption class="sequence-label"><span>${i + 1}</span>${escapeHtml(stage.label)}</figcaption><div class="sequence-visual" aria-hidden="true"><img alt="${escapeHtml(stage.alt ?? stage.label)}"></div></figure>`).join('');
    return { kind: 'sequence', body: `${headingMarkup(s)}<div class="sequence-panels">${panels}</div><div class="sequence-controls" role="status"><strong data-sequence-note></strong><span data-sequence-progress></span></div>` };
  }
  if (s.type === 'chat') return { kind: 'chat', body: chatMarkup(s) };
  if (s.type === 'arena') return { kind: 'arena', body: arenaMarkup(s) };
  if (s.type === 'stamina') return { kind: 'stamina', body: staminaMarkup(s) };
  if (s.type === 'sensors') return { kind: 'sensors', body: sensorsMarkup(s) };
  if (s.type === 'toc') return { kind: 'toc', body: tocMarkup() };
  if (s.type === 'act') {
    if (deck.portal.sectionStyle === 'plain') {
      if (deck.portal.sectionIntro === 'stage') {
        return {
          kind: 'opening',
          body: `<div class="curtain-top" aria-hidden="true"></div><p class="act-num">${escapeHtml(actLabels(s).num)}</p><h2 class="act-title">${rich(s.title)}</h2>`,
        };
      }
      return { kind: 'statement', body: headingMarkup({ kicker: actLabels(s).num, title: s.title }) };
    }
    const act = actLabels(s);
    return {
      kind: 'act',
      body: `<div class="curtain-top"></div><p class="act-num">${act.num}</p><p class="act-title">${escapeHtml(act.role)}</p><p class="act-sub">${rich(s.title)}</p>`,
    };
  }
  if (s.type === 'hypothesis') {
    const claims = s.claims.map(claim => `<p class="hypo-claim">“${rich(claim)}”</p>`).join('');
    const context = s.points ? `<ul class="hypo-context">${s.points.map(pt => `<li>${rich(pt)}</li>`).join('')}</ul>` : '';
    return { kind: 'hypothesis', body: `<div class="hypo">${context}<p class="hypo-label">${escapeHtml(s.title)}</p>${claims}</div>` };
  }
  if (s.type === 'table') {
    const cells = [
      ...s.head.map(label => `<span class="table-head">${escapeHtml(label)}</span>`),
      ...s.rows.flatMap(row => row.map((cell, i) => `<span class="table-cell${i === 0 ? ' table-label' : ''}${i === row.length - 1 ? ' table-last' : ''}">${rich(cell)}</span>`)),
    ].join('');
    return { kind: 'table', body: `${headingMarkup(s)}<div class="table" style="--cols: ${s.head.length}">${cells}</div>` };
  }
  if (s.type === 'cycle' || s.type === 'flow') {
    const steps = s.steps.map(step => `<span class="cycle-step">${rich(step)}</span>`).join('<span class="cycle-arrow">▶</span>');
    const loop = s.type === 'cycle' ? `↺ ${rich(s.loop)}` : rich(s.loop);
    return { kind: 'cycle', body: `${headingMarkup(s)}<div class="cycle"><div class="cycle-steps">${steps}</div><p class="cycle-loop">${loop}</p></div>` };
  }
  if (s.type === 'gaps') {
    const head = ['', '누가', '왜 우리에게?', '필요한 것'].map(label => `<span class="gaps-head">${label}</span>`).join('');
    const rows = s.rows.map(row => `
      <span class="gaps-tag">${escapeHtml(row.tag)}</span>
      <span class="gaps-who">${escapeHtml(row.who)}</span>
      <span class="gaps-why">${escapeHtml(row.why)}</span>
      <span class="gaps-need">${escapeHtml(row.need)}</span>`).join('');
    return { kind: 'gaps', body: `${headingMarkup(s)}<div class="gaps">${head}${rows}</div>` };
  }
  if (s.type === 'compare') {
    const col = (side, cls) => `<div class="compare-col ${cls}"><p class="compare-label">${escapeHtml(side.label)}</p><p class="compare-text">${rich(side.text)}</p></div>`;
    return { kind: 'compare', body: `${headingMarkup(s)}<div class="compare">${col(s.before, 'before')}<span class="compare-arrow">▶</span>${col(s.after, 'after')}</div>` };
  }
  if (s.type === 'cards') {
    const cards = s.cards.map(card => `<section class="info-card"><p class="card-label">${escapeHtml(card.label)}</p><h3 class="card-title">${rich(card.title)}</h3>${card.detail ? `<p class="card-detail">${rich(card.detail)}</p>` : ''}</section>`).join('');
    return { kind: 'cards', body: `${headingMarkup(s)}<div class="cards">${cards}</div>${s.takeaway ? `<p class="cards-takeaway">${rich(s.takeaway)}</p>` : ''}` };
  }
  if (s.type === 'crossroads' || s.type === 'dialogue') return { kind: 'crossroads', body: crossroadMarkup(s) };

  const points = s.points ? `<ul class="slide-points">${s.points.map(pt => `<li>${rich(pt)}</li>`).join('')}</ul>` : '';
  const media = mediaMarkup(s);
  const hasText = points || s.subtitle || s.big;
  if (media && hasText) return { kind: 'split', body: `<div class="slide-text">${headingMarkup(s)}${points}</div>${media}` };
  if (media) return { kind: 'media', body: `${headingMarkup(s)}${media}` };
  return { kind: points ? 'list' : 'statement', body: `${headingMarkup(s)}${points}` };
}
