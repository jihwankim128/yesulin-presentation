<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">코드만 되돌려서 실패한 롤백</title><desc id="desc">처음에는 옛 코드와 DB 컬럼 4개가 맞아 정상 실행된다. 새 코드 배포 때 안 쓰는 컬럼 4개를 삭제한다. 옛 코드로만 되돌리면 삭제한 DB 컬럼이 없어 시작 검사에 실패한다.</desc>
<style>text{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
@keyframes remove-columns {0%,22%{opacity:1;transform:translateY(0)} 38%,100%{opacity:0;transform:translateY(10px)}}
@keyframes rollback-code {0%,45%{opacity:.55;transform:translateY(-10px)} 62%,100%{opacity:1;transform:translateY(0)}}
@keyframes error-outline {0%,65%{stroke:#ded5ed} 80%{stroke:#b63e52;stroke-width:5} 100%{stroke:#b63e52;stroke-width:2}}
@keyframes draw-link {from{stroke-dashoffset:80}to{stroke-dashoffset:0}}
.removed{opacity:0;animation:remove-columns 4.8s ease both}.returned{animation:rollback-code 4.8s ease both}.error-outline{animation:error-outline 4.8s ease both}.flow-line{stroke-dasharray:8 8;animation:draw-link 4s linear infinite}

@media(prefers-reduced-motion:reduce){.motion{animation:none!important}.removed{opacity:0}}
</style><rect x="8" y="8" width="376" height="308" rx="12" fill="#faf8ff" stroke="#ded5ed" stroke-width="2" /><circle cx="40" cy="34" r="17" fill="#7450b4"/><text x="40" y="42" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="70" y="43" font-size="27" fill="#28213c" font-weight="750" text-anchor="start">처음에는 정상</text><rect x="28" y="66" width="336" height="85" rx="12" fill="#eee7fa" stroke="#b9a5da" stroke-width="2" /><text x="46" y="99" font-size="28" fill="#7450b4" font-weight="800" text-anchor="start">옛 코드</text><text x="46" y="133" font-size="23" fill="#28213c" font-weight="500" text-anchor="start">컬럼 4개를 사용</text><path d="M196 155 v17" stroke="#187863" stroke-width="3"/><path d="M190 169 l6 7 6 -7" fill="#187863"/><text x="35" y="202" font-size="24" fill="#28213c" font-weight="800" text-anchor="start">DB</text><rect x="91" y="178" width="55" height="40" rx="5" fill="#d9eee5" stroke="#187863" stroke-width="2" /><text x="118" y="205" font-size="20" fill="#187863" font-weight="700" text-anchor="middle">1</text><rect x="157" y="178" width="55" height="40" rx="5" fill="#d9eee5" stroke="#187863" stroke-width="2" /><text x="184" y="205" font-size="20" fill="#187863" font-weight="700" text-anchor="middle">2</text><rect x="223" y="178" width="55" height="40" rx="5" fill="#d9eee5" stroke="#187863" stroke-width="2" /><text x="250" y="205" font-size="20" fill="#187863" font-weight="700" text-anchor="middle">3</text><rect x="289" y="178" width="55" height="40" rx="5" fill="#d9eee5" stroke="#187863" stroke-width="2" /><text x="316" y="205" font-size="20" fill="#187863" font-weight="700" text-anchor="middle">4</text><text x="196" y="246" font-size="25" fill="#187863" font-weight="650" text-anchor="middle">필요한 컬럼이 있다</text><path d="M65 282 l6 6 13 -14" fill="none" stroke="#187863" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="291" font-size="25" fill="#187863" font-weight="700" text-anchor="start">정상 실행</text><path d="M386 160 h23" fill="none" stroke="#7450b4" stroke-width="4"/><path d="M406 153 l10 7 -10 7" fill="#7450b4"/><rect x="412" y="8" width="376" height="308" rx="12" fill="#faf8ff" stroke="#ded5ed" stroke-width="2" /><circle cx="444" cy="34" r="17" fill="#7450b4"/><text x="444" y="42" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="474" y="43" font-size="27" fill="#28213c" font-weight="750" text-anchor="start">새 버전 배포</text><rect x="432" y="66" width="336" height="85" rx="12" fill="#eee7fa" stroke="#b9a5da" stroke-width="2" /><text x="450" y="99" font-size="28" fill="#7450b4" font-weight="800" text-anchor="start">새 코드</text><text x="450" y="133" font-size="23" fill="#28213c" font-weight="500" text-anchor="start">이 컬럼들은 사용 안 함</text><path d="M600 155 v17" stroke="#187863" stroke-width="3"/><path d="M594 169 l6 7 6 -7" fill="#187863"/><text x="439" y="202" font-size="24" fill="#28213c" font-weight="800" text-anchor="start">DB</text><rect x="495" y="178" width="55" height="40" rx="5" fill="#fff6f6" stroke="#b63e52" stroke-width="2" stroke-dasharray="5 4"/><text x="522" y="206" font-size="28" fill="#b63e52" font-weight="500" text-anchor="middle">×</text><g class="motion removed"><rect x="495" y="178" width="55" height="40" rx="5" fill="#d9eee5" stroke="#187863" stroke-width="2" /><text x="522" y="205" font-size="20" fill="#187863" font-weight="700" text-anchor="middle">1</text></g><rect x="561" y="178" width="55" height="40" rx="5" fill="#fff6f6" stroke="#b63e52" stroke-width="2" stroke-dasharray="5 4"/><text x="588" y="206" font-size="28" fill="#b63e52" font-weight="500" text-anchor="middle">×</text><g class="motion removed"><rect x="561" y="178" width="55" height="40" rx="5" fill="#d9eee5" stroke="#187863" stroke-width="2" /><text x="588" y="205" font-size="20" fill="#187863" font-weight="700" text-anchor="middle">2</text></g><rect x="627" y="178" width="55" height="40" rx="5" fill="#fff6f6" stroke="#b63e52" stroke-width="2" stroke-dasharray="5 4"/><text x="654" y="206" font-size="28" fill="#b63e52" font-weight="500" text-anchor="middle">×</text><g class="motion removed"><rect x="627" y="178" width="55" height="40" rx="5" fill="#d9eee5" stroke="#187863" stroke-width="2" /><text x="654" y="205" font-size="20" fill="#187863" font-weight="700" text-anchor="middle">3</text></g><rect x="693" y="178" width="55" height="40" rx="5" fill="#fff6f6" stroke="#b63e52" stroke-width="2" stroke-dasharray="5 4"/><text x="720" y="206" font-size="28" fill="#b63e52" font-weight="500" text-anchor="middle">×</text><g class="motion removed"><rect x="693" y="178" width="55" height="40" rx="5" fill="#d9eee5" stroke="#187863" stroke-width="2" /><text x="720" y="205" font-size="20" fill="#187863" font-weight="700" text-anchor="middle">4</text></g><text x="600" y="246" font-size="25" fill="#b63e52" font-weight="650" text-anchor="middle">DB에서 컬럼 4개 삭제</text><path d="M469 282 l6 6 13 -14" fill="none" stroke="#187863" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="504" y="291" font-size="24" fill="#187863" font-weight="700" text-anchor="start">새 코드는 정상 실행</text><path d="M790 160 h23" fill="none" stroke="#7450b4" stroke-width="4"/><path d="M810 153 l10 7 -10 7" fill="#7450b4"/><rect x="816" y="8" width="376" height="308" rx="12" fill="#fff6f6" stroke="#b63e52" stroke-width="2" class="motion error-outline"/><circle cx="848" cy="34" r="17" fill="#b63e52"/><text x="848" y="42" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="878" y="43" font-size="27" fill="#28213c" font-weight="750" text-anchor="start">옛 코드로 롤백</text><g class="motion returned"><rect x="836" y="66" width="336" height="85" rx="12" fill="#eee7fa" stroke="#b9a5da" stroke-width="2" /><text x="854" y="99" font-size="28" fill="#7450b4" font-weight="800" text-anchor="start">옛 코드</text><text x="854" y="133" font-size="23" fill="#28213c" font-weight="500" text-anchor="start">다시 컬럼 4개가 필요</text></g><path d="M1004 155 v17" stroke="#b63e52" stroke-width="3"/><path d="M998 169 l6 7 6 -7" fill="#b63e52"/><text x="843" y="202" font-size="24" fill="#28213c" font-weight="800" text-anchor="start">DB</text><rect x="899" y="178" width="55" height="40" rx="5" fill="#fff6f6" stroke="#b63e52" stroke-width="2" stroke-dasharray="5 4"/><text x="926" y="206" font-size="28" fill="#b63e52" font-weight="500" text-anchor="middle">×</text><rect x="965" y="178" width="55" height="40" rx="5" fill="#fff6f6" stroke="#b63e52" stroke-width="2" stroke-dasharray="5 4"/><text x="992" y="206" font-size="28" fill="#b63e52" font-weight="500" text-anchor="middle">×</text><rect x="1031" y="178" width="55" height="40" rx="5" fill="#fff6f6" stroke="#b63e52" stroke-width="2" stroke-dasharray="5 4"/><text x="1058" y="206" font-size="28" fill="#b63e52" font-weight="500" text-anchor="middle">×</text><rect x="1097" y="178" width="55" height="40" rx="5" fill="#fff6f6" stroke="#b63e52" stroke-width="2" stroke-dasharray="5 4"/><text x="1124" y="206" font-size="28" fill="#b63e52" font-weight="500" text-anchor="middle">×</text><text x="1004" y="246" font-size="25" fill="#b63e52" font-weight="650" text-anchor="middle">삭제된 DB는 그대로</text><text x="1004" y="291" font-size="27" fill="#b63e52" font-weight="800" text-anchor="middle">컬럼 없음 → 시작 실패</text><rect x="8" y="332" width="1184" height="49" rx="10" fill="#f1eafa" stroke="#cbb8e7" stroke-width="2" /><text x="600" y="365" font-size="29" fill="#7450b4" font-weight="750" text-anchor="middle">코드만 되돌려도, 삭제된 DB 컬럼은 돌아오지 않는다</text></svg>