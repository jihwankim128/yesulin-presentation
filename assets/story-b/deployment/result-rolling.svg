<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">서버 2대 순차 배포 중 실패한 헬스 요청 0건</title><desc id="desc">2026년 10월 21일 순차 배포 측정: 전체 헬스 요청 2988건 중 실패 0건. A 배포 중에는 B가, B 배포 중에는 A가 응답했다. 이어진 선은 응답이 계속됐음을 설명하는 개념도이며 실시간 데이터나 시간 비율을 나타내지 않는다.</desc>
<style>text{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif}.flow{stroke-dasharray:12 16;animation:flow 3s linear infinite}@keyframes flow{from{stroke-dashoffset:112}to{stroke-dashoffset:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style>
<text x="600" y="55" font-size="29" fill="#7a7485" font-weight="600" text-anchor="middle">실패한 헬스 요청</text><text x="600" y="205" font-size="154" fill="#187863" font-weight="800" text-anchor="middle">0건</text><path d="M140 300 H1060" fill="none" stroke="#cee6db" stroke-width="10" stroke-linecap="round"/><path class="flow" d="M140 300 H1060" fill="none" stroke="#187863" stroke-width="6"/><circle cx="140" cy="300" r="9" fill="#187863"/><circle cx="1060" cy="300" r="9" fill="#187863"/><text x="340" y="358" font-size="29" fill="#187863" font-weight="700" text-anchor="middle">B가 응답</text><text x="860" y="358" font-size="29" fill="#187863" font-weight="700" text-anchor="middle">A가 응답</text></svg>