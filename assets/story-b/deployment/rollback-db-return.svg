<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 290" role="img" aria-labelledby="title desc">
<title id="title">옛 코드로 되돌렸지만 시작 실패</title>
<desc id="desc">옛 코드가 돌아와 삭제된 컬럼 네 개를 찾지만 DB는 그대로다. 필요한 컬럼이 없어 시작 검사에 실패한다.</desc>
<style>
text{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
@keyframes return-code{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
@keyframes show-failure{from{opacity:0}to{opacity:1}}
.returned{animation:return-code .55s ease both}.failed{animation:show-failure .3s .55s ease both}
@media(prefers-reduced-motion:reduce){.returned,.failed{animation:none}}
</style>
<g class="returned">
<rect x="12" y="6" width="326" height="88" rx="10" fill="#fff" stroke="#b9a5da" stroke-width="2"/>
<text x="175" y="42" text-anchor="middle" fill="#7450b4" font-size="29" font-weight="750">옛 코드</text>
<text x="175" y="77" text-anchor="middle" fill="#51465f" font-size="23">다시 컬럼 4개가 필요</text>
</g>
<path d="M175 104v22m-7-6 7 8 7-8" fill="none" stroke="#b63e52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="16" y="173" fill="#51465f" font-size="23" font-weight="750">DB</text>
<g fill="#fff6f6" stroke="#b63e52" stroke-width="2" stroke-dasharray="4 4">
<rect x="68" y="144" width="57" height="43" rx="5"/><rect x="136" y="144" width="57" height="43" rx="5"/><rect x="204" y="144" width="57" height="43" rx="5"/><rect x="272" y="144" width="57" height="43" rx="5"/>
</g>
<g fill="#b63e52" font-size="30" text-anchor="middle"><text x="96" y="176">×</text><text x="164" y="176">×</text><text x="232" y="176">×</text><text x="300" y="176">×</text></g>
<text x="175" y="222" text-anchor="middle" fill="#b63e52" font-size="23">필요한 컬럼이 없다</text>
<g class="failed"><rect x="12" y="246" width="326" height="39" rx="7" fill="#f8dce2"/>
<text x="175" y="274" text-anchor="middle" fill="#b63e52" font-size="26" font-weight="750">컬럼 없음 → 시작 실패</text></g>
</svg>
