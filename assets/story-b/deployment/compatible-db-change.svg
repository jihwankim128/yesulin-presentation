<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">컬럼을 안 쓰는 코드를 먼저 배포하고 나중에 DB 컬럼을 삭제한다</title><desc id="desc">첫 운영 배포에서 삭제할 컬럼을 쓰지 않는 코드로 바꾸되 DB 컬럼은 남긴다. 실제 사용과 구버전 호환성을 검증한다. 옛 코드가 더는 필요 없을 때 별도 운영 배포에서 컬럼을 삭제한다.</desc>
<style>text{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif}.requests{stroke-dasharray:8 10;animation:request-flow 2s linear infinite}@keyframes request-flow{from{stroke-dashoffset:72}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.motion{animation:none!important}}</style>
<rect x="8" y="7" width="376" height="307" rx="10" fill="#faf8ff" stroke="#ded5ed" stroke-width="2" class=""/><circle cx="39" cy="34" r="17" fill="#7450b4"/><text x="39" y="42" font-size="22" fill="#fff" font-weight="750" text-anchor="middle">1</text><text x="68" y="43" font-size="26" fill="#28213c" font-weight="750" text-anchor="start">코드부터 바꾸기</text><rect x="28" y="66" width="336" height="87" rx="10" fill="#eee7fa" stroke="#b9a5da" stroke-width="2" class=""/><text x="44" y="100" font-size="28" fill="#7450b4" font-weight="800" text-anchor="start">새 코드 배포</text><text x="44" y="134" font-size="22" fill="#28213c" font-weight="500" text-anchor="start">삭제할 컬럼은 사용 안 함</text><text x="34" y="211" font-size="25" fill="#28213c" font-weight="800" text-anchor="start">DB</text><rect x="91" y="185" width="55" height="42" rx="5" fill="#d9eee5" stroke="#187863" stroke-width="2" class=""/><text x="118" y="214" font-size="21" fill="#187863" font-weight="750" text-anchor="middle">1</text><rect x="157" y="185" width="55" height="42" rx="5" fill="#d9eee5" stroke="#187863" stroke-width="2" class=""/><text x="184" y="214" font-size="21" fill="#187863" font-weight="750" text-anchor="middle">2</text><rect x="223" y="185" width="55" height="42" rx="5" fill="#d9eee5" stroke="#187863" stroke-width="2" class=""/><text x="250" y="214" font-size="21" fill="#187863" font-weight="750" text-anchor="middle">3</text><rect x="289" y="185" width="55" height="42" rx="5" fill="#d9eee5" stroke="#187863" stroke-width="2" class=""/><text x="316" y="214" font-size="21" fill="#187863" font-weight="750" text-anchor="middle">4</text><text x="196" y="264" font-size="24" fill="#187863" font-weight="750" text-anchor="middle">DB 컬럼은 남겨둔다</text><text x="196" y="294" font-size="21" fill="#736a83" font-weight="500" text-anchor="middle">1차 운영 배포</text><path d="M388 166 h13" fill="none" stroke="#7450b4" stroke-width="4"/><path d="M398 159 l10 7 -10 7" fill="#7450b4"/><rect x="412" y="7" width="376" height="307" rx="10" fill="#faf8ff" stroke="#ded5ed" stroke-width="2" class=""/><circle cx="443" cy="34" r="17" fill="#7450b4"/><text x="443" y="42" font-size="22" fill="#fff" font-weight="750" text-anchor="middle">2</text><text x="472" y="43" font-size="26" fill="#28213c" font-weight="750" text-anchor="start">운영에서 확인하기</text><rect x="432" y="66" width="336" height="87" rx="10" fill="#eee7fa" stroke="#b9a5da" stroke-width="2" class=""/><text x="448" y="100" font-size="28" fill="#7450b4" font-weight="800" text-anchor="start">실제 동작 확인</text><text x="448" y="134" font-size="22" fill="#28213c" font-weight="500" text-anchor="start">옛 코드 호환성도 확인</text><text x="438" y="211" font-size="25" fill="#28213c" font-weight="800" text-anchor="start">DB</text><rect x="495" y="185" width="55" height="42" rx="5" fill="#d9eee5" stroke="#187863" stroke-width="2" class=""/><text x="522" y="214" font-size="21" fill="#187863" font-weight="750" text-anchor="middle">1</text><rect x="561" y="185" width="55" height="42" rx="5" fill="#d9eee5" stroke="#187863" stroke-width="2" class=""/><text x="588" y="214" font-size="21" fill="#187863" font-weight="750" text-anchor="middle">2</text><rect x="627" y="185" width="55" height="42" rx="5" fill="#d9eee5" stroke="#187863" stroke-width="2" class=""/><text x="654" y="214" font-size="21" fill="#187863" font-weight="750" text-anchor="middle">3</text><rect x="693" y="185" width="55" height="42" rx="5" fill="#d9eee5" stroke="#187863" stroke-width="2" class=""/><text x="720" y="214" font-size="21" fill="#187863" font-weight="750" text-anchor="middle">4</text><text x="600" y="264" font-size="24" fill="#187863" font-weight="750" text-anchor="middle">옛 코드로 복구되는지 확인</text><text x="600" y="294" font-size="21" fill="#736a83" font-weight="500" text-anchor="middle">사용·호환성 검증</text><path d="M792 166 h13" fill="none" stroke="#7450b4" stroke-width="4"/><path d="M802 159 l10 7 -10 7" fill="#7450b4"/><rect x="816" y="7" width="376" height="307" rx="10" fill="#faf8ff" stroke="#ded5ed" stroke-width="2" class=""/><circle cx="847" cy="34" r="17" fill="#7450b4"/><text x="847" y="42" font-size="22" fill="#fff" font-weight="750" text-anchor="middle">3</text><text x="876" y="43" font-size="26" fill="#28213c" font-weight="750" text-anchor="start">나중에 컬럼 삭제</text><rect x="836" y="66" width="336" height="87" rx="10" fill="#eee7fa" stroke="#b9a5da" stroke-width="2" class=""/><text x="852" y="100" font-size="28" fill="#7450b4" font-weight="800" text-anchor="start">새 코드 유지</text><text x="852" y="134" font-size="22" fill="#28213c" font-weight="500" text-anchor="start">옛 코드가 더는 필요 없을 때</text><text x="842" y="211" font-size="25" fill="#28213c" font-weight="800" text-anchor="start">DB</text><rect x="899" y="185" width="55" height="42" rx="5" fill="#f5f2f8" stroke="#736a83" stroke-width="2" stroke-dasharray="5 4"/><text x="926" y="216" font-size="27" fill="#736a83" font-weight="500" text-anchor="middle">×</text><rect x="965" y="185" width="55" height="42" rx="5" fill="#f5f2f8" stroke="#736a83" stroke-width="2" stroke-dasharray="5 4"/><text x="992" y="216" font-size="27" fill="#736a83" font-weight="500" text-anchor="middle">×</text><rect x="1031" y="185" width="55" height="42" rx="5" fill="#f5f2f8" stroke="#736a83" stroke-width="2" stroke-dasharray="5 4"/><text x="1058" y="216" font-size="27" fill="#736a83" font-weight="500" text-anchor="middle">×</text><rect x="1097" y="185" width="55" height="42" rx="5" fill="#f5f2f8" stroke="#736a83" stroke-width="2" stroke-dasharray="5 4"/><text x="1124" y="216" font-size="27" fill="#736a83" font-weight="500" text-anchor="middle">×</text><text x="1004" y="264" font-size="24" fill="#7450b4" font-weight="750" text-anchor="middle">별도 배포에서 컬럼 삭제</text><text x="1004" y="294" font-size="21" fill="#736a83" font-weight="500" text-anchor="middle">검증 후 다음 운영 배포</text><rect x="8" y="332" width="1184" height="49" rx="10" fill="#eee7fa" stroke="#cbb8e7" stroke-width="2" class=""/><text x="600" y="365" font-size="29" fill="#7450b4" font-weight="750" text-anchor="middle">PR만 나누지 말고, 운영 배포도 단계별로 나눈다</text></svg>