<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">현재 DB와 호환되는 배포본으로 두 서버를 순서대로 복구</title><desc id="desc">현재 DB와 맞는 직전 배포본을 고른다. 서버 A 복구 중에는 B가 요청을 받고, A의 정상 복귀 후 B를 복구한다. 두 서버 복구까지 약 6분 동안 헬스 요청 2421건 중 실패는 0건이었다. 같은 코드의 다른 빌드로 롤백한 검증이다.</desc>
<style>text{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
@keyframes request-flow{from{stroke-dashoffset:42}to{stroke-dashoffset:0}}
@keyframes restoring{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes first-turn{0%,30%{stroke:#7450b4;stroke-width:3}35%,100%{stroke:#ded5ed;stroke-width:2}}
@keyframes second-turn{0%,30%{stroke:#ded5ed;stroke-width:2}35%,65%{stroke:#7450b4;stroke-width:3}70%,100%{stroke:#ded5ed;stroke-width:2}}
@keyframes complete-turn{0%,65%{stroke:#aed3c6;stroke-width:2}70%,90%{stroke:#187863;stroke-width:4}100%{stroke:#187863;stroke-width:2}}
.requests{stroke-dasharray:7 7;animation:request-flow 1.8s linear infinite}.restoring{animation:restoring 1.6s ease-in-out infinite}.turn1{animation:first-turn 6s ease both}.turn2{animation:second-turn 6s ease both}.turn3{animation:complete-turn 6s ease both}

@media(prefers-reduced-motion:reduce){.motion{animation:none!important}.removed{opacity:0}}
</style><rect x="8" y="0" width="1184" height="49" rx="10" fill="#eee7fa" stroke="#d7c9ec" stroke-width="2" /><path d="M29 25 l6 6 13 -14" fill="none" stroke="#7450b4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="61" y="33" font-size="28" fill="#7450b4" font-weight="750" text-anchor="start">먼저 선택: 현재 DB와 맞는 직전 배포본</text><text x="1168" y="32" font-size="23" fill="#736a83" font-weight="600" text-anchor="end">같은 코드 · 다른 빌드</text><rect x="8" y="65" width="376" height="220" rx="12" fill="#faf8ff" stroke="#ded5ed" stroke-width="2" class="motion turn1"/><circle cx="39" cy="94" r="16" fill="#7450b4"/><text x="39" y="102" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="67" y="103" font-size="25" fill="#28213c" font-weight="750" text-anchor="start">A부터 복구</text><rect x="104" y="124" width="260" height="62" rx="8" fill="#eee7fa" stroke="#7450b4" stroke-width="2" /><rect x="116" y="136" width="37" height="38" rx="5" fill="#fff" stroke="#7450b4" stroke-width="2" /><text x="134" y="163" font-size="25" fill="#7450b4" font-weight="800" text-anchor="middle">A</text><text x="174" y="151" font-size="26" fill="#7450b4" font-weight="800" text-anchor="start">복구 중</text><text x="174" y="175" font-size="18" fill="#736a83" font-weight="500" text-anchor="start">요청에서 잠시 제외</text><g class="motion restoring"><rect x="329" y="138" width="6" height="6" fill="#7450b4"/><rect x="339" y="138" width="6" height="6" fill="#7450b4"/></g><text x="47" y="217" font-size="19" fill="#187863" font-weight="700" text-anchor="middle">요청</text><path class="motion requests" d="M22 238 H96" stroke="#187863" stroke-width="4"/><path d="M88 231 l11 7 -11 7" fill="#187863"/><rect x="104" y="199" width="260" height="62" rx="8" fill="#dff1e8" stroke="#187863" stroke-width="2" /><rect x="116" y="211" width="37" height="38" rx="5" fill="#fff" stroke="#187863" stroke-width="2" /><text x="134" y="238" font-size="25" fill="#187863" font-weight="800" text-anchor="middle">B</text><text x="174" y="226" font-size="26" fill="#187863" font-weight="800" text-anchor="start">응답 중</text><text x="174" y="250" font-size="18" fill="#736a83" font-weight="500" text-anchor="start">요청을 계속 받음</text><path d="M386 173 h23" fill="none" stroke="#7450b4" stroke-width="4"/><path d="M406 166 l10 7 -10 7" fill="#7450b4"/><rect x="412" y="65" width="376" height="220" rx="12" fill="#faf8ff" stroke="#ded5ed" stroke-width="2" class="motion turn2"/><circle cx="443" cy="94" r="16" fill="#7450b4"/><text x="443" y="102" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="471" y="103" font-size="25" fill="#28213c" font-weight="750" text-anchor="start">A가 돌아오면 B 복구</text><text x="451" y="142" font-size="19" fill="#187863" font-weight="700" text-anchor="middle">요청</text><path class="motion requests" d="M426 163 H500" stroke="#187863" stroke-width="4"/><path d="M492 156 l11 7 -11 7" fill="#187863"/><rect x="508" y="124" width="260" height="62" rx="8" fill="#dff1e8" stroke="#187863" stroke-width="2" /><rect x="520" y="136" width="37" height="38" rx="5" fill="#fff" stroke="#187863" stroke-width="2" /><text x="538" y="163" font-size="25" fill="#187863" font-weight="800" text-anchor="middle">A</text><text x="578" y="151" font-size="26" fill="#187863" font-weight="800" text-anchor="start">응답 중</text><text x="578" y="175" font-size="18" fill="#736a83" font-weight="500" text-anchor="start">요청을 계속 받음</text><rect x="508" y="199" width="260" height="62" rx="8" fill="#eee7fa" stroke="#7450b4" stroke-width="2" /><rect x="520" y="211" width="37" height="38" rx="5" fill="#fff" stroke="#7450b4" stroke-width="2" /><text x="538" y="238" font-size="25" fill="#7450b4" font-weight="800" text-anchor="middle">B</text><text x="578" y="226" font-size="26" fill="#7450b4" font-weight="800" text-anchor="start">복구 중</text><text x="578" y="250" font-size="18" fill="#736a83" font-weight="500" text-anchor="start">요청에서 잠시 제외</text><g class="motion restoring"><rect x="733" y="213" width="6" height="6" fill="#7450b4"/><rect x="743" y="213" width="6" height="6" fill="#7450b4"/></g><path d="M790 173 h23" fill="none" stroke="#7450b4" stroke-width="4"/><path d="M810 166 l10 7 -10 7" fill="#7450b4"/><rect x="816" y="65" width="376" height="220" rx="12" fill="#edf8f2" stroke="#aed3c6" stroke-width="2" class="motion turn3"/><circle cx="847" cy="94" r="16" fill="#187863"/><text x="847" y="102" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="875" y="103" font-size="25" fill="#28213c" font-weight="750" text-anchor="start">두 서버 복구 완료</text><text x="855" y="142" font-size="19" fill="#187863" font-weight="700" text-anchor="middle">요청</text><path class="motion requests" d="M830 163 H904" stroke="#187863" stroke-width="4"/><path d="M896 156 l11 7 -11 7" fill="#187863"/><rect x="912" y="124" width="260" height="62" rx="8" fill="#dff1e8" stroke="#187863" stroke-width="2" /><rect x="924" y="136" width="37" height="38" rx="5" fill="#fff" stroke="#187863" stroke-width="2" /><text x="942" y="163" font-size="25" fill="#187863" font-weight="800" text-anchor="middle">A</text><text x="982" y="151" font-size="26" fill="#187863" font-weight="800" text-anchor="start">복구 완료</text><text x="982" y="175" font-size="18" fill="#736a83" font-weight="500" text-anchor="start">요청을 계속 받음</text><text x="855" y="217" font-size="19" fill="#187863" font-weight="700" text-anchor="middle">요청</text><path class="motion requests" d="M830 238 H904" stroke="#187863" stroke-width="4"/><path d="M896 231 l11 7 -11 7" fill="#187863"/><rect x="912" y="199" width="260" height="62" rx="8" fill="#dff1e8" stroke="#187863" stroke-width="2" /><rect x="924" y="211" width="37" height="38" rx="5" fill="#fff" stroke="#187863" stroke-width="2" /><text x="942" y="238" font-size="25" fill="#187863" font-weight="800" text-anchor="middle">B</text><text x="982" y="226" font-size="26" fill="#187863" font-weight="800" text-anchor="start">복구 완료</text><text x="982" y="250" font-size="18" fill="#736a83" font-weight="500" text-anchor="start">요청을 계속 받음</text><rect x="8" y="305" width="376" height="76" rx="10" fill="#fff" stroke="#ded5ed" stroke-width="2" /><text x="28" y="351" font-size="24" fill="#736a83" font-weight="600" text-anchor="start">헬스 요청</text><text x="360" y="356" font-size="38" fill="#7450b4" font-weight="800" text-anchor="end">2,421건</text><rect x="412" y="305" width="376" height="76" rx="10" fill="#fff" stroke="#ded5ed" stroke-width="2" /><text x="432" y="351" font-size="24" fill="#736a83" font-weight="600" text-anchor="start">실패</text><text x="764" y="356" font-size="38" fill="#187863" font-weight="800" text-anchor="end">0건</text><rect x="816" y="305" width="376" height="76" rx="10" fill="#fff" stroke="#ded5ed" stroke-width="2" /><text x="836" y="351" font-size="24" fill="#736a83" font-weight="600" text-anchor="start">복구 시간</text><text x="1168" y="356" font-size="38" fill="#7450b4" font-weight="800" text-anchor="end">약 6분</text></svg>