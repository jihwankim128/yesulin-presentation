<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">A의 롤백은 실패했지만 B는 계속 응답</title><desc id="desc">서버 A는 옛 버전의 시작 검사에 실패해 마지막 성공 버전으로 자동 복구됐다. B의 배포는 건너뛰고 계속 요청을 받게 했다. 이 과정에서 헬스 요청 3289건 중 실패는 0건이었다.</desc>
<style>text{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif}.flow{stroke-dasharray:12 16;animation:flow 3s linear infinite}@keyframes flow{from{stroke-dashoffset:112}to{stroke-dashoffset:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style>
<rect x="57" y="22" width="490" height="348" rx="18" fill="#faedf0"/><text x="302" y="72" font-size="29" fill="#7a7485" font-weight="600" text-anchor="middle">서버 A</text><rect x="262" y="101" width="80" height="99" rx="8" fill="#fff" stroke="#b63e52" stroke-width="4"/><rect x="277" y="122" width="33" height="6" fill="#b63e52"/><circle cx="324" cy="125" r="4" fill="#b63e52" class=""/><rect x="277" y="147" width="33" height="6" fill="#b63e52"/><circle cx="324" cy="150" r="4" fill="#b63e52" class=""/><rect x="277" y="172" width="33" height="6" fill="#b63e52"/><circle cx="324" cy="175" r="4" fill="#b63e52" class=""/><text x="302" y="268" font-size="43" fill="#b63e52" font-weight="800" text-anchor="middle">롤백 실패</text><text x="302" y="322" font-size="31" fill="#7450b4" font-weight="650" text-anchor="middle">→ 자동 복구</text><rect x="653" y="22" width="490" height="348" rx="18" fill="#eaf4ee"/><text x="898" y="72" font-size="29" fill="#7a7485" font-weight="600" text-anchor="middle">서버 B</text><rect x="858" y="101" width="80" height="99" rx="8" fill="#fff" stroke="#187863" stroke-width="4"/><rect x="873" y="122" width="33" height="6" fill="#187863"/><circle cx="920" cy="125" r="4" fill="#187863" class="pulse"/><rect x="873" y="147" width="33" height="6" fill="#187863"/><circle cx="920" cy="150" r="4" fill="#187863" class="pulse"/><rect x="873" y="172" width="33" height="6" fill="#187863"/><circle cx="920" cy="175" r="4" fill="#187863" class="pulse"/><text x="898" y="268" font-size="43" fill="#187863" font-weight="800" text-anchor="middle">응답 유지</text><text x="898" y="322" font-size="29" fill="#7a7485" font-weight="550" text-anchor="middle">배포는 건너뜀</text></svg>