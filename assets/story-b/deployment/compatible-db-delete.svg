<rect x="136" y="144" width="57" height="43" rx="5" fill="#f5f2f8" stroke="#81758f" stroke-width="2" stroke-dasharray="4 4"/><text x="164" y="176" fill="#81758f" font-size="30" text-anchor="middle">×</text>
