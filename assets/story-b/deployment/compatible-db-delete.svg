<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 290" role="img" aria-labelledby="title desc"><title id="title">나중에 컬럼 삭제</title><desc id="desc">컬럼 삭제의 단계적 배포 예시. 옛 코드가 더는 필요 없을 때 별도 운영 배포에서 컬럼을 삭제한다.</desc><style>text{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
@keyframes code-enter{from{opacity:0;transform:translateY(-9px)}to{opacity:1;transform:translateY(0)}}
@keyframes check-draw{from{stroke-dashoffset:34}to{stroke-dashoffset:0}}
@keyframes remove-column{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(12px)}}
.code{animation:code-enter .5s ease both}.check{stroke-dasharray:34;animation:check-draw .4s .2s ease both}.check.second{animation-delay:.55s}.removed{animation:remove-column .5s ease both}
@media(prefers-reduced-motion:reduce){.code,.check,.removed{animation:none!important}.removed{opacity:0}}
</style>
<g class="code"><rect x="12" y="6" width="326" height="88" rx="10" fill="#fff" stroke="#b9a5da" stroke-width="2"/>
<text x="175" y="42" text-anchor="middle" fill="#7450b4" font-size="29" font-weight="750">새 코드 유지</text><text x="175" y="77" text-anchor="middle" fill="#51465f" font-size="23">옛 코드가 불필요할 때</text>
</g><path d="M175 104v22m-7-6 7 8 7-8" fill="none" stroke="#7450b4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16" y="173" fill="#51465f" font-size="23" font-weight="750">DB</text>
