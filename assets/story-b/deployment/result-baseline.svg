<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">서버 1대 배포 중 실패한 헬스 요청 222건</title><desc id="desc">2026년 10월 21일 기준선 측정: 전체 헬스 요청 1144건 중 222건이 503 오류로 실패했다. 배포 중 유일한 서버가 요청 대상에서 빠져 응답이 끊겼다. 끊긴 선은 이를 설명하는 개념도이며 시간 비율을 나타내지 않는다. 최장 중단 164.5초에는 측정 공백을 중단으로 판정한 구간이 포함된다.</desc>
<style>text{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif}.flow{stroke-dasharray:12 16;animation:flow 3s linear infinite}@keyframes flow{from{stroke-dashoffset:112}to{stroke-dashoffset:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style>
<text x="600" y="55" font-size="29" fill="#7a7485" font-weight="600" text-anchor="middle">실패한 헬스 요청</text><text x="600" y="205" font-size="154" fill="#b63e52" font-weight="800" text-anchor="middle">222건</text><path d="M140 300 H448 M752 300 H1060" fill="none" stroke="#c7c2ce" stroke-width="10" stroke-linecap="round"/><circle cx="448" cy="300" r="9" fill="#b63e52"/><circle cx="752" cy="300" r="9" fill="#b63e52"/><text x="600" y="310" font-size="35" fill="#b63e52" font-weight="750" text-anchor="middle">응답 끊김</text><text x="290" y="358" font-size="27" fill="#7a7485" font-weight="500" text-anchor="middle">배포 전</text><text x="910" y="358" font-size="27" fill="#7a7485" font-weight="500" text-anchor="middle">배포 후</text></svg>